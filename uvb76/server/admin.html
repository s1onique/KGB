<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UVB-76 Control Plane</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        h1 { color: #58a6ff; margin-bottom: 1rem; font-weight: 600; }
        h2 { color: #8b949e; margin: 1.5rem 0 1rem; font-weight: 500; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 1.5rem; margin-bottom: 1rem; }
        .target { border-left: 4px solid #58a6ff; }
        .target.reachable { border-left-color: #3fb950; }
        .target.unreachable { border-left-color: #f85149; }
        .status { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 4px; font-size: 0.875rem; font-weight: 500; }
        .status.ok { background: #238636; color: #ffffff; }
        .status.warn { background: #9e6a03; color: #ffffff; }
        .status.error { background: #da3633; color: #ffffff; }
        .status.unknown { background: #484f58; color: #ffffff; }
        .checks { margin-top: 1rem; }
        .check { padding: 0.5rem; background: #0d1117; border-radius: 4px; margin-top: 0.5rem; }
        .meta { color: #8b949e; font-size: 0.875rem; margin-top: 0.5rem; }
        .error-text { color: #f85149; }
        
        /* Login Form Styles - Cold War UVB-76 Identity with improved contrast */
        #auth-form { max-width: 400px; margin: 4rem auto; text-align: center; }
        #auth-form h2 { color: #c9d1d9; font-size: 1.5rem; margin-bottom: 0.5rem; }
        #auth-form .subtitle { color: #8b949e; font-size: 0.875rem; margin-bottom: 1.5rem; }
        #auth-form input { 
            display: block; 
            width: 100%; 
            padding: 0.75rem; 
            margin: 0.5rem 0; 
            border-radius: 6px; 
            border: 1px solid #30363d; 
            background: #0d1117; 
            color: #c9d1d9;
            font-size: 1rem;
        }
        #auth-form input:focus { 
            outline: none; 
            border-color: #58a6ff; 
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }
        #auth-form input::placeholder { color: #6e7681; }
        #auth-form button { 
            width: 100%; 
            padding: 0.75rem; 
            background: #238636; 
            color: #ffffff; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            margin-top: 1rem;
            font-size: 1rem;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        #auth-form button:hover { background: #2ea043; }
        #auth-form button:disabled { 
            background: #21262d; 
            color: #6e7681; 
            cursor: not-allowed; 
        }
        #auth-error { 
            color: #f85149; 
            font-size: 0.875rem; 
            margin-top: 1rem;
            padding: 0.5rem;
            background: rgba(248, 81, 73, 0.1);
            border-radius: 4px;
        }
        .hidden { display: none; }
        .latency-card { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #30363d; }
        
        /* Latency metadata */
        .latency-meta { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 1rem; 
            margin-bottom: 1rem; 
            font-size: 0.75rem; 
            color: #8b949e;
        }
        .latency-meta span { 
            background: #0d1117; 
            padding: 0.25rem 0.5rem; 
            border-radius: 4px; 
            border: 1px solid #30363d;
        }
        .latency-meta .label { color: #6e7681; }
        
        /* Percentile stats */
        .percentile-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 0.5rem; margin-bottom: 1rem; }
        .percentile-stat { background: #0d1117; padding: 0.75rem; border-radius: 4px; text-align: center; border: 1px solid #30363d; }
        .percentile-stat .label { font-size: 0.625rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
        .percentile-stat .value { font-size: 1.25rem; font-weight: 600; margin-top: 0.25rem; }
        .percentile-stat .value.p50 { color: #3fb950; }
        .percentile-stat .value.p90 { color: #58a6ff; }
        .percentile-stat .value.p95 { color: #a371f7; }
        .percentile-stat .value.p99 { color: #f0883e; }
        
        /* Graph container */
        .graph-container { margin-top: 0.5rem; }
        .graph-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .graph-title { font-size: 0.75rem; color: #8b949e; }
        .graph-legend { display: flex; gap: 1rem; font-size: 0.625rem; }
        .legend-item { display: flex; align-items: center; gap: 0.25rem; }
        .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
        .legend-dot.p50 { background: #3fb950; }
        .legend-dot.p90 { background: #58a6ff; }
        .legend-dot.p95 { background: #a371f7; }
        .legend-dot.p99 { background: #f0883e; }
        
        /* SVG Graph */
        .latency-graph { width: 100%; height: 200px; background: #0d1117; border-radius: 4px; border: 1px solid #30363d; }
        .graph-line { fill: none; stroke-width: 1.5; }
        .graph-line.p50 { stroke: #3fb950; }
        .graph-line.p90 { stroke: #58a6ff; }
        .graph-line.p95 { stroke: #a371f7; }
        .graph-line.p99 { stroke: #f0883e; }
        .graph-axis { stroke: #30363d; stroke-width: 1; }
        .graph-grid { stroke: #21262d; stroke-width: 0.5; stroke-dasharray: 2,2; }
        .graph-label { fill: #6e7681; font-size: 10px; font-family: sans-serif; }
        .graph-tick { stroke: #30363d; stroke-width: 1; }
        
        /* Warning for low sample count */
        .low-sample-warning { 
            font-size: 0.75rem; 
            color: #9e6a03; 
            background: rgba(158, 106, 3, 0.1); 
            padding: 0.5rem; 
            border-radius: 4px; 
            margin-top: 0.5rem;
        }
        
        /* Loading spinner */
        .loading { text-align: center; padding: 2rem; color: #8b949e; }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 2px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Header with logout */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .logout-btn {
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid #30363d;
            color: #8b949e;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        .logout-btn:hover { 
            background: #21262d; 
            color: #c9d1d9;
            border-color: #8b949e;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <div id="auth-form">
            <h2>Sign in to UVB-76</h2>
            <p class="subtitle">Control plane access</p>
            <input type="text" id="username" placeholder="Username" autocomplete="username">
            <input type="password" id="password" placeholder="Password" autocomplete="current-password">
            <button type="button" id="login-btn" onclick="login()">Sign In</button>
            <p id="auth-error" class="hidden"></p>
        </div>
        
        <!-- Loading State -->
        <div id="loading" class="hidden">
            <div class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 1rem;">Checking authentication...</p>
            </div>
        </div>
        
        <!-- Dashboard -->
        <div id="dashboard" class="hidden">
            <div class="header">
                <h1>UVB-76 Control Plane</h1>
                <button class="logout-btn" onclick="logout()">Sign Out</button>
            </div>
            <div class="card">
                <h2>Targets</h2>
                <div id="targets"></div>
            </div>
        </div>
    </div>
    
    <script>
        // Global state
        let authToken = null;
        let refreshInterval = null;
        let targets = [];
        
        // Helper to format latency values
        function formatMs(v) {
            return Number.isFinite(v) ? v.toFixed(1) + 'ms' : '—';
        }
        
        // DOM Elements
        const authForm = document.getElementById('auth-form');
        const loadingDiv = document.getElementById('loading');
        const dashboardDiv = document.getElementById('dashboard');
        const loginBtn = document.getElementById('login-btn');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const authError = document.getElementById('auth-error');
        
        // Initialize - check auth status on page load
        document.addEventListener('DOMContentLoaded', checkAuth);
        
        // Support Enter key to submit
        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
        usernameInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                passwordInput.focus();
            }
        });
        
        async function checkAuth() {
            showLoading();
            try {
                const resp = await fetch('/api/v1/auth/check');
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.authenticated) {
                        showDashboard();
                        loadTargets();
                    } else {
                        showLoginForm();
                    }
                } else {
                    showLoginForm();
                }
            } catch (e) {
                showLoginForm();
            }
        }
        
        async function login() {
            const user = usernameInput.value;
            const pass = passwordInput.value;
            
            if (!user || !pass) {
                showError('Please enter username and password');
                return;
            }
            
            // Disable button and show loading state
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';
            hideError();
            
            try {
                const resp = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.success) {
                        hideError();
                        showDashboard();
                        loadTargets();
                    } else {
                        showError('Invalid credentials');
                    }
                } else {
                    showError('Invalid credentials');
                }
            } catch (e) {
                showError('Connection error. Please try again.');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        }
        
        async function logout() {
            // Clear polling interval first
            stopRefreshInterval();
            
            try {
                await fetch('/api/v1/auth/logout', { method: 'POST' });
            } catch (e) {
                // Ignore logout errors
            }
            showLoginForm();
            // Clear form
            usernameInput.value = '';
            passwordInput.value = '';
        }
        
        function stopRefreshInterval() {
            if (refreshInterval !== null) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }
        
        async function loadTargets() {
            // Clear any existing refresh interval
            stopRefreshInterval();
            
            try {
                const resp = await fetch('/api/v1/targets');
                if (resp.ok) {
                    targets = await resp.json();
                    const container = document.getElementById('targets');
                    container.innerHTML = targets.map(t => `
                        <div class="card target" id="target-${t.id}">
                            <strong>${t.name}</strong> (${t.id})
                            <br><span class="meta">${t.base_url}</span>
                            <div class="meta" id="status-${t.id}">Loading...</div>
                            <div class="latency-card" id="latency-${t.id}">
                                <div class="latency-meta" id="meta-${t.id}">Loading latency...</div>
                                <div class="percentile-stats" id="stats-${t.id}"></div>
                                <div class="graph-container" id="graph-container-${t.id}">
                                    <div class="graph-header">
                                        <span class="graph-title">HTTP Status Probe Latency (ms)</span>
                                        <div class="graph-legend">
                                            <span class="legend-item"><span class="legend-dot p50"></span>p50</span>
                                            <span class="legend-item"><span class="legend-dot p90"></span>p90</span>
                                            <span class="legend-item"><span class="legend-dot p95"></span>p95</span>
                                            <span class="legend-item"><span class="legend-dot p99"></span>p99</span>
                                        </div>
                                    </div>
                                    <svg class="latency-graph" id="graph-${t.id}" viewBox="0 0 600 200"></svg>
                                </div>
                                <div class="low-sample-warning hidden" id="warning-${t.id}">
                                    Low sample count; tail percentiles are approximate.
                                </div>
                            </div>
                        </div>
                    `).join('');
                    for (const t of targets) {
                        loadSnapshot(t.id);
                        loadLatency(t.id);
                    }
                    // Refresh latency every 30 seconds (store ID so we can clear it)
                    refreshInterval = setInterval(() => {
                        for (const t of targets) {
                            loadLatency(t.id);
                        }
                    }, 30000);
                } else if (resp.status === 401) {
                    // Session expired
                    stopRefreshInterval();
                    showLoginForm();
                }
            } catch (e) {
                console.error('Failed to load targets:', e);
            }
        }
        
        async function loadSnapshot(id) {
            try {
                const resp = await fetch('/api/v1/targets/' + id + '/snapshot');
                const el = document.getElementById('status-' + id);
                if (resp.ok) {
                    const snap = await resp.json();
                    const reachable = snap.reachable;
                    el.parentElement.classList.toggle('reachable', reachable);
                    el.parentElement.classList.toggle('unreachable', !reachable);
                    el.innerHTML = reachable 
                        ? `<span class="status ${snap.status || 'unknown'}">${snap.status || 'unknown'}</span> Node: ${snap.node_id || 'N/A'}`
                        : `<span class="status error">unreachable</span> ${snap.error || ''}`;
                } else {
                    el.innerHTML = '<span class="status unknown">no data</span>';
                }
            } catch (e) {
                const el = document.getElementById('status-' + id);
                el.innerHTML = '<span class="status unknown">error</span>';
            }
        }
        
        async function loadLatency(id) {
            try {
                // Fetch both summary and series data
                const [summaryResp, seriesResp] = await Promise.all([
                    fetch('/api/v1/targets/' + id + '/latency'),
                    fetch('/api/v1/latency/series?target_id=' + id + '&range_seconds=3600&step_seconds=60&window_seconds=300')
                ]);
                
                const metaEl = document.getElementById('meta-' + id);
                const statsEl = document.getElementById('stats-' + id);
                const graphEl = document.getElementById('graph-' + id);
                const warningEl = document.getElementById('warning-' + id);
                
                if (!summaryResp.ok) {
                    metaEl.innerHTML = '<span>Error loading latency data</span>';
                    return;
                }
                
                const summary = await summaryResp.json();
                let series = null;
                if (seriesResp.ok) {
                    series = await seriesResp.json();
                }
                
                if (summary.sample_count === 0) {
                    metaEl.innerHTML = '<span>No latency data</span>';
                    statsEl.innerHTML = '<div class="percentile-stat"><div class="label">No data</div></div>';
                    drawEmptyGraph(graphEl);
                    warningEl.classList.add('hidden');
                    return;
                }
                
                // Update metadata with retained range display
                const probeInterval = series ? series.interval_seconds : '?';
                const windowSec = series ? series.window_seconds : '?';
                const retainedSec = series ? series.retained_range_seconds : null;
                const retainedLabel = Number.isFinite(retainedSec) ? `${Math.round(retainedSec / 60)}m retained` : 'retention unknown';
                metaEl.innerHTML = `
                    <span><span class="label">Probe:</span> HTTP status probe</span>
                    <span><span class="label">Interval:</span> every ${probeInterval}s</span>
                    <span><span class="label">Window:</span> ${windowSec}s trailing</span>
                    <span><span class="label">Retained:</span> ${retainedLabel}</span>
                    <span><span class="label">Samples:</span> ${summary.sample_count}</span>
                `;
                
                // Update percentile stats using formatMs helper
                statsEl.innerHTML = `
                    <div class="percentile-stat">
                        <div class="label">Latest p50</div>
                        <div class="value p50">${formatMs(summary.p50_latency_ms)}</div>
                    </div>
                    <div class="percentile-stat">
                        <div class="label">Latest p90</div>
                        <div class="value p90">${formatMs(summary.p90_latency_ms)}</div>
                    </div>
                    <div class="percentile-stat">
                        <div class="label">Latest p95</div>
                        <div class="value p95">${formatMs(summary.p95_latency_ms)}</div>
                    </div>
                    <div class="percentile-stat">
                        <div class="label">Latest p99</div>
                        <div class="value p99">${formatMs(summary.p99_latency_ms)}</div>
                    </div>
                `;
                
                // Draw graph
                if (series && series.points) {
                    drawLatencyGraph(graphEl, series.points);
                    
                    // Show warning if sample count is low (points[0] is oldest, last is newest)
                    const latestPoint = series.points[series.points.length - 1];
                    if (latestPoint && latestPoint.sample_count < 10) {
                        warningEl.classList.remove('hidden');
                    } else {
                        warningEl.classList.add('hidden');
                    }
                } else {
                    drawEmptyGraph(graphEl);
                }
                
            } catch (e) {
                console.error('Failed to load latency for', id, e);
                const metaEl = document.getElementById('meta-' + id);
                metaEl.innerHTML = '<span>Error loading</span>';
            }
        }
        
        function drawLatencyGraph(svg, points) {
            const width = 600;
            const height = 200;
            const padding = { top: 20, right: 20, bottom: 30, left: 50 };
            const graphWidth = width - padding.left - padding.right;
            const graphHeight = height - padding.top - padding.bottom;
            
            // Find max value for scaling (use p99 or max of available percentiles)
            // Use Number.isFinite to check for null/undefined (JSON null serializes correctly)
            let maxVal = 100;
            for (const point of points) {
                if (Number.isFinite(point.p99_ms) && point.p99_ms > maxVal) maxVal = point.p99_ms;
                if (Number.isFinite(point.p95_ms) && point.p95_ms > maxVal) maxVal = point.p95_ms;
                if (Number.isFinite(point.p90_ms) && point.p90_ms > maxVal) maxVal = point.p90_ms;
                if (Number.isFinite(point.p50_ms) && point.p50_ms > maxVal) maxVal = point.p50_ms;
            }
            // Round up to nice number
            maxVal = Math.ceil(maxVal / 100) * 100;
            if (maxVal < 100) maxVal = 100;
            
            // Filter points that have at least some data
            // Use Number.isFinite to check for null/undefined (JSON null serializes correctly)
            const validPoints = points.map((p, i) => ({ ...p, index: i }))
                .filter(p => Number.isFinite(p.p50_ms) || Number.isFinite(p.p90_ms) || Number.isFinite(p.p95_ms) || Number.isFinite(p.p99_ms));
            
            if (validPoints.length === 0) {
                drawEmptyGraph(svg);
                return;
            }
            
            // Build path data
            const buildPath = (getter) => {
                const coords = validPoints.map(p => {
                    const x = padding.left + (p.index / (points.length - 1)) * graphWidth;
                    const val = getter(p);
                    const y = val !== null ? padding.top + (1 - val / maxVal) * graphHeight : null;
                    return { x, y, val };
                }).filter(c => c.y !== null);
                
                if (coords.length === 0) return '';
                
                return coords.map((c, i) => (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
            };
            
            // Generate grid lines
            const numYLabels = 5;
            const yStep = maxVal / numYLabels;
            let gridHTML = '';
            for (let i = 0; i <= numYLabels; i++) {
                const y = padding.top + (i / numYLabels) * graphHeight;
                const val = Math.round((maxVal - i * yStep));
                gridHTML += `<line class="graph-grid" x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}"/>`;
                gridHTML += `<text class="graph-label" x="${padding.left - 5}" y="${y + 3}" text-anchor="end">${val}</text>`;
            }
            
            // X axis labels
            const numXLabels = 6;
            let xLabelsHTML = '';
            for (let i = 0; i <= numXLabels; i++) {
                const x = padding.left + (i / numXLabels) * graphWidth;
                const pointIndex = Math.round((i / numXLabels) * (points.length - 1));
                const point = points[pointIndex];
                if (point) {
                    const date = new Date(point.ts);
                    const label = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    xLabelsHTML += `<text class="graph-label" x="${x}" y="${height - 5}" text-anchor="middle">${label}</text>`;
                }
            }
            
            svg.innerHTML = `
                ${gridHTML}
                <line class="graph-axis" x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${height - padding.bottom}"/>
                <line class="graph-axis" x1="${padding.left}" y1="${height - padding.bottom}" x2="${width - padding.right}" y2="${height - padding.bottom}"/>
                ${xLabelsHTML}
                <path class="graph-line p99" d="${buildPath(p => p.p99_ms)}"/>
                <path class="graph-line p95" d="${buildPath(p => p.p95_ms)}"/>
                <path class="graph-line p90" d="${buildPath(p => p.p90_ms)}"/>
                <path class="graph-line p50" d="${buildPath(p => p.p50_ms)}"/>
            `;
        }
        
        function drawEmptyGraph(svg) {
            svg.innerHTML = `
                <text class="graph-label" x="300" y="100" text-anchor="middle">No data available</text>
            `;
        }
        
        // UI Helpers
        function showLoginForm() {
            stopRefreshInterval();
            authForm.classList.remove('hidden');
            loadingDiv.classList.add('hidden');
            dashboardDiv.classList.add('hidden');
        }
        
        function showDashboard() {
            authForm.classList.add('hidden');
            loadingDiv.classList.add('hidden');
            dashboardDiv.classList.remove('hidden');
        }
        
        function showLoading() {
            authForm.classList.add('hidden');
            loadingDiv.classList.remove('hidden');
            dashboardDiv.classList.add('hidden');
        }
        
        function showError(msg) {
            authError.textContent = msg;
            authError.classList.remove('hidden');
        }
        
        function hideError() {
            authError.classList.add('hidden');
        }
    </script>
</body>
</html>
