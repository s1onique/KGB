<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UVB-76 Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        h1 { color: #e94560; margin-bottom: 1rem; }
        h2 { color: #0f3460; margin: 1.5rem 0 1rem; }
        .card { background: #16213e; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
        .target { border-left: 4px solid #e94560; }
        .target.reachable { border-left-color: #4ecca3; }
        .target.unreachable { border-left-color: #e94560; }
        .status { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 4px; font-size: 0.875rem; }
        .status.ok { background: #4ecca3; color: #1a1a2e; }
        .status.warn { background: #f9a825; color: #1a1a2e; }
        .status.error { background: #e94560; color: #fff; }
        .status.unknown { background: #666; color: #fff; }
        .checks { margin-top: 1rem; }
        .check { padding: 0.5rem; background: #0f3460; border-radius: 4px; margin-top: 0.5rem; }
        .meta { color: #888; font-size: 0.875rem; margin-top: 0.5rem; }
        .error { color: #e94560; }
        #auth-form { max-width: 400px; margin: 4rem auto; text-align: center; }
        #auth-form input { display: block; width: 100%; padding: 0.75rem; margin: 0.5rem 0; border-radius: 4px; border: 1px solid #0f3460; background: #16213e; color: #eee; }
        #auth-form button { width: 100%; padding: 0.75rem; background: #e94560; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-top: 1rem; }
        #auth-form button:hover { background: #ff6b6b; }
        .hidden { display: none; }
        .latency-card { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #0f3460; }
        .latency-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.5rem; margin-top: 0.5rem; }
        .stat-item { background: #0f3460; padding: 0.5rem; border-radius: 4px; text-align: center; }
        .stat-label { font-size: 0.75rem; color: #888; }
        .stat-value { font-size: 1rem; color: #4ecca3; }
        .sparkline-container { margin-top: 0.5rem; }
        .sparkline { width: 100%; height: 60px; background: #0f3460; border-radius: 4px; }
        .histogram-container { margin-top: 0.5rem; }
        .histogram { display: flex; align-items: flex-end; height: 40px; gap: 2px; }
        .histogram-bar { background: #4ecca3; flex: 1; min-width: 8px; border-radius: 2px 2px 0 0; }
        .histogram-label { font-size: 0.625rem; color: #888; text-align: center; }
        .histogram-row { display: flex; gap: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>UVB-76 Control Plane</h1>
        <div id="auth-form">
            <h2>Authentication Required</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">Sign In</button>
            <p id="auth-error" class="error hidden">Invalid credentials</p>
        </div>
        <div id="dashboard" class="hidden">
            <div class="card">
                <h2>Targets</h2>
                <div id="targets"></div>
            </div>
        </div>
    </div>
    <script>
        let authToken = null;
        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const creds = btoa(user + ':' + pass);
            // Validate credentials against protected endpoint
            const targets = await fetch('/api/v1/targets', { headers: { 'Authorization': 'Basic ' + creds } });
            if (targets.ok) {
                authToken = creds;
                document.getElementById('auth-form').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                loadTargets();
            } else {
                document.getElementById('auth-error').classList.remove('hidden');
            }
        }
        async function loadTargets() {
            const resp = await fetch('/api/v1/targets', { headers: { 'Authorization': 'Basic ' + authToken } });
            const targets = await resp.json();
            const container = document.getElementById('targets');
            container.innerHTML = targets.map(t => `
                <div class="card target" id="target-${t.id}">
                    <strong>${t.name}</strong> (${t.id})
                    <br><span class="meta">${t.base_url}</span>
                    <div class="meta" id="status-${t.id}">Loading...</div>
                    <div class="latency-card" id="latency-${t.id}">
                        <div class="latency-stats" id="stats-${t.id}">Loading latency...</div>
                        <div class="sparkline-container">
                            <canvas class="sparkline" id="canvas-${t.id}" width="400" height="60"></canvas>
                        </div>
                    </div>
                </div>
            `).join('');
            for (const t of targets) {
                loadSnapshot(t.id);
                loadLatency(t.id);
            }
            // Refresh latency every 30 seconds
            setInterval(() => {
                for (const t of targets) {
                    loadLatency(t.id);
                }
            }, 30000);
        }
        async function loadSnapshot(id) {
            const resp = await fetch('/api/v1/targets/' + id + '/snapshot', { headers: { 'Authorization': 'Basic ' + authToken } });
            const el = document.getElementById('status-' + id);
            if (resp.ok) {
                const snap = await resp.json();
                const reachable = snap.reachable;
                el.parentElement.classList.toggle('reachable', reachable);
                el.parentElement.classList.toggle('unreachable', !reachable);
                el.innerHTML = reachable 
                    ? `<span class="status ${snap.status || 'unknown'}">${snap.status || 'unknown'}</span> Node: ${snap.node_id || 'N/A'}`
                    : `<span class="status error">unreachable</span> ${snap.error || ''}`;
            } else {
                el.innerHTML = '<span class="status unknown">no data</span>';
            }
        }
        async function loadLatency(id) {
            const resp = await fetch('/api/v1/targets/' + id + '/latency', { headers: { 'Authorization': 'Basic ' + authToken } });
            const statsEl = document.getElementById('stats-' + id);
            const canvas = document.getElementById('canvas-' + id);
            if (resp.ok) {
                const summary = await resp.json();
                if (summary.sample_count === 0) {
                    statsEl.innerHTML = '<div class="stat-item"><span class="stat-label">No latency data</span></div>';
                    return;
                }
                statsEl.innerHTML = `
                    <div class="stat-item">
                        <div class="stat-label">Samples</div>
                        <div class="stat-value">${summary.sample_count}</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Min</div>
                        <div class="stat-value">${summary.min_latency_ms.toFixed(1)}ms</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Avg</div>
                        <div class="stat-value">${summary.avg_latency_ms.toFixed(1)}ms</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Median</div>
                        <div class="stat-value">${summary.median_latency_ms.toFixed(1)}ms</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Max</div>
                        <div class="stat-value">${summary.max_latency_ms.toFixed(1)}ms</div>
                    </div>
                `;
                // Draw sparkline
                drawSparkline(canvas, summary);
            } else {
                statsEl.innerHTML = '<div class="stat-item"><span class="stat-label">No latency data</span></div>';
            }
        }
        async function loadSamplesAndDraw(id, canvas) {
            const resp = await fetch('/api/v1/targets/' + id + '/latency/samples?limit=50', { headers: { 'Authorization': 'Basic ' + authToken } });
            if (resp.ok) {
                const samples = await resp.json();
                if (samples.length > 0) {
                    drawSparklineFromSamples(canvas, samples);
                }
            }
        }
        function drawSparkline(canvas, summary) {
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const buckets = summary.histogram.buckets;
            const counts = summary.histogram.counts;
            
            ctx.clearRect(0, 0, width, height);
            
            // Find max count for scaling
            const maxCount = Math.max(...counts, 1);
            const barWidth = (width - 20) / counts.length;
            
            // Draw histogram bars
            ctx.fillStyle = '#4ecca3';
            for (let i = 0; i < counts.length; i++) {
                const barHeight = (counts[i] / maxCount) * (height - 20);
                const x = 10 + i * barWidth;
                const y = height - 15 - barHeight;
                ctx.fillRect(x, y, barWidth - 2, barHeight);
            }
            
            // Draw bucket labels
            ctx.fillStyle = '#888';
            ctx.font = '8px sans-serif';
            ctx.textAlign = 'center';
            for (let i = 0; i < buckets.length; i++) {
                const x = 10 + i * barWidth + barWidth / 2;
                ctx.fillText(buckets[i] + 'ms', x, height - 2);
            }
        }
        function drawSparklineFromSamples(canvas, samples) {
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            ctx.clearRect(0, 0, width, height);
            
            if (samples.length < 2) return;
            
            // Extract latencies
            const latencies = samples.map(s => s.latency_ms);
            const min = Math.min(...latencies);
            const max = Math.max(...latencies);
            const range = max - min || 1;
            
            // Draw line
            ctx.strokeStyle = '#4ecca3';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            for (let i = 0; i < latencies.length; i++) {
                const x = 10 + (i / (latencies.length - 1)) * (width - 20);
                const y = height - 15 - ((latencies[i] - min) / range) * (height - 30);
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
            
            // Draw points
            ctx.fillStyle = '#4ecca3';
            for (let i = 0; i < latencies.length; i++) {
                const x = 10 + (i / (latencies.length - 1)) * (width - 20);
                const y = height - 15 - ((latencies[i] - min) / range) * (height - 30);
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    </script>
</body>
</html>
