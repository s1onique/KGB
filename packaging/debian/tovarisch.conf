# tovarisch configuration file
#
# This file is installed as a Debian conffile. Local edits should be
# preserved across package upgrades by dpkg.
#
# BFD is disabled unless explicitly configured and supported by the
# daemon runtime.

[server]
# listen = "127.0.0.1:8317"

# [bfd]
# enabled = true
# local_addr = "192.0.2.10"
# peer_addr = "192.0.2.1"
# interval_ms = 800
# multiplier = 3

# [wg]
# WireGuard server and peer configuration.
# Generates WireGuard server and client config files.
# Runtime mutation (wg-quick, firewall rules, etc.) is out of scope.
#
# enabled = false
# interface = wg-kgb0
# address = 10.149.149.1/24
# listen_port = 51821
# output_dir = /var/lib/kgb/wireguard
# private_key_file = /etc/kgb/wireguard/server.key
# public_key_file = /etc/kgb/wireguard/server.pub
# client_allowed_ips = 10.149.149.0/24

# [wg.peer.phone]
# enabled = false
# address = 10.149.149.10/32
# private_key_file = /etc/kgb/wireguard/peers/phone.key
# public_key_file = /etc/kgb/wireguard/peers/phone.pub
# allowed_ips = 10.149.149.10/32
# endpoint = 127.0.0.1:51821
# persistent_keepalive = 25
# client_output_file = /var/lib/kgb/wireguard/clients/phone.conf
