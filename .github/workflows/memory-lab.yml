# memory-lab.yml — GitHub Actions workflow for memory labs
#
# Runs real memory footprint measurements for tovarisch and uvb76.
# Requires Linux runner for /proc access.
#
# Manual trigger only (workflow_dispatch).
# Can be extended to scheduled/nightly runs later.
#
# Artifacts:
#   - artifacts/memory-labs/tovarisch/*.json
#   - artifacts/memory-labs/uvb76/*.json
#
# Reference: kgb://doctrine/embedded-memory-frugality

name: Memory Lab

on:
  workflow_dispatch:
    inputs:
      skip_tovarisch:
        description: 'Skip tovarisch memory lab'
        required: false
        default: 'false'
        type: boolean
      skip_uvb76:
        description: 'Skip uvb76 memory lab'
        required: false
        default: 'false'
        type: boolean
      run_tovarisch_leak_slope:
        description: 'Run tovarisch leak-slope workload (optional)'
        required: false
        default: 'false'
        type: boolean
      run_tovarisch_leak_slope_netdiag:
        description: 'Run tovarisch leak-slope with network_diag (optional)'
        required: false
        default: 'false'
        type: boolean
      run_uvb76_leak_slope:
        description: 'Run uvb76 leak-slope workload (optional)'
        required: false
        default: 'false'
        type: boolean
      run_uvb76_leak_slope_netdiag:
        description: 'Run uvb76 leak-slope with network_diag (optional)'
        required: false
        default: 'false'
        type: boolean
      # === Long-window/manual mode inputs ===
      leak_slope_profile:
        description: 'Leak-slope soak profile: short (10s), medium (5min), long (15min), manual_soak (60min)'
        required: false
        default: 'short'
        type: choice
        options:
          - short
          - medium
          - long
          - manual_soak
      # Manual override inputs (used when leak_slope_profile=manual_soak)
      leak_slope_warmup_seconds:
        description: 'Warmup seconds for manual leak-slope (default: 300)'
        required: false
        default: '300'
        type: string
      leak_slope_operations:
        description: 'Number of operations for manual leak-slope (default: 36000 for 60min)'
        required: false
        default: '36000'
        type: string
      leak_slope_interval_ms:
        description: 'Interval between operations in ms (default: 100)'
        required: false
        default: '100'
        type: string

env:
  # Disable Go CGO for cross-compilation compatibility
  CGO_ENABLED: 0

jobs:
  memory-lab:
    name: Memory Lab
    # Linux runner required for /proc access (memory sampling)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0

      - name: Build tovarisch
        if: ${{ !inputs.skip_tovarisch }}
        run: make tovarisch-build

      - name: Preflight tovarisch CLI
        if: ${{ !inputs.skip_tovarisch }}
        run: |
          echo "=== tovarisch --help ==="
          ./tovarisch/zig-out/bin/tovarisch --help
          echo ""
          echo "=== tovarisch serve --help ==="
          ./tovarisch/zig-out/bin/tovarisch serve --help 2>&1 || true

      - name: Build uvb76
        if: ${{ !inputs.skip_uvb76 }}
        run: make uvb76-build

      - name: Build memory-lab
        run: make memory-lab

      - name: Run tovarisch memory lab
        if: ${{ !inputs.skip_tovarisch }}
        run: make lab-tovarisch-memory

      - name: Run uvb76 memory lab
        if: ${{ !inputs.skip_uvb76 }}
        run: make lab-uvb76-memory

      # === Optional Leak-Slope Workloads ===
      # These are optional soaks that measure memory growth slope over repeated requests.
      # They are NOT required for the basic memory-gate but can be enabled manually.

      - name: Run tovarisch leak-slope workload (short window)
        if: ${{ inputs.run_tovarisch_leak_slope && inputs.leak_slope_profile == 'short' }}
        run: |
          ./tools/memory-lab/memory-lab \
            --service tovarisch \
            --workload tovarisch-leak-slope \
            --warmup-secs 60 \
            --operations 100 \
            --interval-ms 100

      - name: Run tovarisch leak-slope workload (medium window)
        if: ${{ inputs.run_tovarisch_leak_slope && inputs.leak_slope_profile == 'medium' }}
        run: |
          ./tools/memory-lab/memory-lab \
            --service tovarisch \
            --workload tovarisch-leak-slope \
            --warmup-secs 120 \
            --operations 3000 \
            --interval-ms 100

      - name: Run tovarisch leak-slope workload (long window)
        if: ${{ inputs.run_tovarisch_leak_slope && inputs.leak_slope_profile == 'long' }}
        run: |
          ./tools/memory-lab/memory-lab \
            --service tovarisch \
            --workload tovarisch-leak-slope \
            --warmup-secs 180 \
            --operations 9000 \
            --interval-ms 100

      - name: Run tovarisch leak-slope workload (manual soak)
        if: ${{ inputs.run_tovarisch_leak_slope && inputs.leak_slope_profile == 'manual_soak' }}
        run: |
          ./tools/memory-lab/memory-lab \
            --service tovarisch \
            --workload tovarisch-leak-slope \
            --warmup-secs ${{ inputs.leak_slope_warmup_seconds }} \
            --operations ${{ inputs.leak_slope_operations }} \
            --interval-ms ${{ inputs.leak_slope_interval_ms }}

      - name: Run tovarisch leak-slope with network_diag (short window)
        if: ${{ inputs.run_tovarisch_leak_slope_netdiag && inputs.leak_slope_profile == 'short' }}
        run: |
          ./tools/memory-lab/memory-lab \
            --service tovarisch \
            --workload tovarisch-leak-slope-netdiag \
            --warmup-secs 60 \
            --operations 100 \
            --interval-ms 100

      - name: Run tovarisch leak-slope with network_diag (medium window)
        if: ${{ inputs.run_tovarisch_leak_slope_netdiag && inputs.leak_slope_profile == 'medium' }}
        run: |
          ./tools/memory-lab/memory-lab \
            --service tovarisch \
            --workload tovarisch-leak-slope-netdiag \
            --warmup-secs 120 \
            --operations 3000 \
            --interval-ms 100

      - name: Run tovarisch leak-slope with network_diag (long window)
        if: ${{ inputs.run_tovarisch_leak_slope_netdiag && inputs.leak_slope_profile == 'long' }}
        run: |
          ./tools/memory-lab/memory-lab \
            --service tovarisch \
            --workload tovarisch-leak-slope-netdiag \
            --warmup-secs 180 \
            --operations 9000 \
            --interval-ms 100

      - name: Run tovarisch leak-slope with network_diag (manual soak)
        if: ${{ inputs.run_tovarisch_leak_slope_netdiag && inputs.leak_slope_profile == 'manual_soak' }}
        run: |
          ./tools/memory-lab/memory-lab \
            --service tovarisch \
            --workload tovarisch-leak-slope-netdiag \
            --warmup-secs ${{ inputs.leak_slope_warmup_seconds }} \
            --operations ${{ inputs.leak_slope_operations }} \
            --interval-ms ${{ inputs.leak_slope_interval_ms }}

      - name: Run uvb76 leak-slope workload (short window)
        if: ${{ inputs.run_uvb76_leak_slope && inputs.leak_slope_profile == 'short' }}
        run: |
          ./tools/memory-lab/memory-lab \
            --service uvb76 \
            --workload uvb76-leak-slope \
            --config ./uvb76/uvb76.memory-lab.json \
            --warmup-secs 60 \
            --operations 100 \
            --interval-ms 100

      - name: Run uvb76 leak-slope workload (medium window)
        if: ${{ inputs.run_uvb76_leak_slope && inputs.leak_slope_profile == 'medium' }}
        run: |
          ./tools/memory-lab/memory-lab \
            --service uvb76 \
            --workload uvb76-leak-slope \
            --config ./uvb76/uvb76.memory-lab.json \
            --warmup-secs 120 \
            --operations 3000 \
            --interval-ms 100

      - name: Run uvb76 leak-slope workload (long window)
        if: ${{ inputs.run_uvb76_leak_slope && inputs.leak_slope_profile == 'long' }}
        run: |
          ./tools/memory-lab/memory-lab \
            --service uvb76 \
            --workload uvb76-leak-slope \
            --config ./uvb76/uvb76.memory-lab.json \
            --warmup-secs 180 \
            --operations 9000 \
            --interval-ms 100

      - name: Run uvb76 leak-slope workload (manual soak)
        if: ${{ inputs.run_uvb76_leak_slope && inputs.leak_slope_profile == 'manual_soak' }}
        run: |
          ./tools/memory-lab/memory-lab \
            --service uvb76 \
            --workload uvb76-leak-slope \
            --config ./uvb76/uvb76.memory-lab.json \
            --warmup-secs ${{ inputs.leak_slope_warmup_seconds }} \
            --operations ${{ inputs.leak_slope_operations }} \
            --interval-ms ${{ inputs.leak_slope_interval_ms }}

      - name: Run uvb76 leak-slope with network_diag (short window)
        if: ${{ inputs.run_uvb76_leak_slope_netdiag && inputs.leak_slope_profile == 'short' }}
        run: |
          ./tools/memory-lab/memory-lab \
            --service uvb76 \
            --workload uvb76-leak-slope-netdiag \
            --config ./uvb76/uvb76.memory-lab.json \
            --warmup-secs 60 \
            --operations 100 \
            --interval-ms 100

      - name: Run uvb76 leak-slope with network_diag (medium window)
        if: ${{ inputs.run_uvb76_leak_slope_netdiag && inputs.leak_slope_profile == 'medium' }}
        run: |
          ./tools/memory-lab/memory-lab \
            --service uvb76 \
            --workload uvb76-leak-slope-netdiag \
            --config ./uvb76/uvb76.memory-lab.json \
            --warmup-secs 120 \
            --operations 3000 \
            --interval-ms 100

      - name: Run uvb76 leak-slope with network_diag (long window)
        if: ${{ inputs.run_uvb76_leak_slope_netdiag && inputs.leak_slope_profile == 'long' }}
        run: |
          ./tools/memory-lab/memory-lab \
            --service uvb76 \
            --workload uvb76-leak-slope-netdiag \
            --config ./uvb76/uvb76.memory-lab.json \
            --warmup-secs 180 \
            --operations 9000 \
            --interval-ms 100

      - name: Run uvb76 leak-slope with network_diag (manual soak)
        if: ${{ inputs.run_uvb76_leak_slope_netdiag && inputs.leak_slope_profile == 'manual_soak' }}
        run: |
          ./tools/memory-lab/memory-lab \
            --service uvb76 \
            --workload uvb76-leak-slope-netdiag \
            --config ./uvb76/uvb76.memory-lab.json \
            --warmup-secs ${{ inputs.leak_slope_warmup_seconds }} \
            --operations ${{ inputs.leak_slope_operations }} \
            --interval-ms ${{ inputs.leak_slope_interval_ms }}

      - name: Upload memory lab diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: memory-lab-diagnostics
          path: |
            artifacts/memory-labs/**/stdout.log
            artifacts/memory-labs/**/*.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload tovarisch memory artifacts
        if: ${{ !inputs.skip_tovarisch }}
        uses: actions/upload-artifact@v4
        with:
          name: tovarisch-memory-lab
          path: artifacts/memory-labs/tovarisch/
          retention-days: 30
          if-no-files-found: error

      - name: Upload uvb76 memory artifacts
        if: ${{ !inputs.skip_uvb76 }}
        uses: actions/upload-artifact@v4
        with:
          name: uvb76-memory-lab
          # Exclude sensitive TLS material and derived configs from artifacts
          # Generated keys/certs are ephemeral localhost material, not secrets but should not be archived
          path: |
            artifacts/memory-labs/uvb76/*.json
            !artifacts/memory-labs/uvb76/*.key
            !artifacts/memory-labs/uvb76/*.crt
            !artifacts/memory-labs/uvb76/*.derived.json
          retention-days: 30
          if-no-files-found: error

      - name: Verify memory lab artifacts
        run: python3 scripts/verify_memory_lab_artifact.py --require-real-evidence
