name: Health Audit

on:
  schedule:
    # Weekly Monday 06:17 UTC.
    # Avoid minute 0 because GitHub notes high load near the top of the hour.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  health-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Required for git-history-based doc freshness checks
          fetch-depth: 0

      - name: Run health audit
        run: make health-audit
