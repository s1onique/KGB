name: BGP/BFD reconnect lab

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: bgp-bfd-reconnect-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconnect-lab:
    name: BGP/BFD reconnect lab
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ZIG_VERSION: "0.16.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Show Zig version
        run: zig version

      - name: Install lab dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            iproute2 \
            iptables \
            jq \
            tcpdump \
            bird2 \
            curl \
            iputils-ping \
            make

      - name: Detect BIRD version
        run: |
          if command -v birdc &> /dev/null; then
            echo "BIRD command client available"
            birdc show version 2>/dev/null || bird --version 2>/dev/null || true
          elif command -v bird &> /dev/null; then
            bird --version
          else
            echo "WARNING: BIRD not found after install"
          fi

      - name: Preflight Linux network namespace support
        run: |
          set -euxo pipefail
          sudo -n true || { echo "ERROR: sudo required"; exit 1; }
          echo "Testing network namespace creation..."
          sudo ip netns add ci_netns_preflight || { echo "ERROR: ip netns add failed - check CAP_NET_ADMIN"; exit 1; }
          echo "Testing namespace execution..."
          sudo ip netns exec ci_netns_preflight ip link show || { echo "ERROR: ip netns exec failed"; exit 1; }
          echo "Cleaning up preflight namespace..."
          sudo ip netns delete ci_netns_preflight
          echo "PASS: Linux network namespaces available"

      - name: Build tovarisch for Linux
        run: |
          cd tovarisch
          zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe

      - name: Make scripts executable
        run: |
          chmod +x scripts/lab_bgp_bfd_reconnect.sh
          chmod +x scripts/lab_bgp_bfd_reconnect_bgp_reset.sh
          chmod +x scripts/lab_bgp_bfd_reconnect_lib.sh
          chmod +x scripts/verify_bgp_reconnect_artifact.sh

      - name: Run BGP/BFD reconnect lab (BIRD restart scenario)
        run: |
          set -euxo pipefail
          sudo --preserve-env=PATH,TOVARISCH_BINARY make lab-bgp-bfd-reconnect
        id: lab

      - name: Run BGP/BFD reconnect lab (BGP protocol reset scenario)
        run: |
          set -euxo pipefail
          sudo --preserve-env=PATH,TOVARISCH_BINARY make lab-bgp-bfd-reconnect-bgp-reset
        id: lab-bgp-reset

      - name: Verify reconnect artifacts
        run: |
          set -euxo pipefail
          # Find the latest reconnect lab artifacts directory
          ARTIFACT_DIR=$(find /tmp/kgb-bgp-bfd-reconnect-* -type d -name "artifacts" 2>/dev/null | head -1 || echo "")
          if [[ -z "$ARTIFACT_DIR" ]] || [[ ! -d "$ARTIFACT_DIR" ]]; then
            echo "ERROR: Reconnect artifacts directory not found"
            echo "Contents of /tmp/kgb-bgp-bfd-reconnect-*:"
            find /tmp/kgb-bgp-bfd-reconnect-* -type d 2>/dev/null || echo "No directories found"
            echo "Lab step may have failed silently or artifacts not created"
            exit 1
          fi
          echo "Verifying artifacts in: $ARTIFACT_DIR"
          sudo scripts/verify_bgp_reconnect_artifact.sh "$ARTIFACT_DIR"

      - name: Make lab logs readable
        if: always()
        run: |
          sudo chmod -R a+rX /tmp/kgb-bgp-bfd-reconnect-* 2>/dev/null || true

      - name: Upload lab artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgp-bfd-reconnect-lab-${{ github.run_id }}
          path: |
            /tmp/kgb-bgp-bfd-reconnect-*/artifacts/**
            /tmp/kgb-bgp-bfd-reconnect-bgp-reset-*/artifacts/**
          if-no-files-found: warn
          retention-days: 14
