name: BGP/BFD reconnect lab

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: bgp-bfd-reconnect-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconnect-lab:
    name: BGP/BFD reconnect lab
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ZIG_VERSION: "0.16.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Show Zig version
        run: zig version

      - name: Install lab dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            iproute2 \
            iptables \
            jq \
            tcpdump \
            bird2 \
            curl \
            iputils-ping \
            make

      - name: Detect BIRD version
        run: |
          if command -v birdc &> /dev/null; then
            echo "BIRD command client available"
            birdc show version 2>/dev/null || bird --version 2>/dev/null || true
          elif command -v bird &> /dev/null; then
            bird --version
          else
            echo "WARNING: BIRD not found after install"
          fi

      - name: Preflight Linux network namespace support
        run: |
          set -euxo pipefail
          sudo -n true
          sudo ip netns add ci_netns_preflight || true
          sudo ip netns exec ci_netns_preflight ip link show || true
          sudo ip netns delete ci_netns_preflight || true
          echo "Linux network namespaces available"

      - name: Build tovarisch for Linux
        run: |
          cd tovarisch
          zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe

      - name: Make scripts executable
        run: |
          chmod +x scripts/lab_bgp_bfd_reconnect.sh
          chmod +x scripts/verify_bgp_reconnect_artifact.sh

      - name: Run BGP/BFD reconnect lab
        run: |
          set -euxo pipefail
          sudo --preserve-env=PATH,TOVARISCH_BINARY make lab-bgp-bfd-reconnect
        id: lab

      - name: Verify reconnect artifacts
        run: |
          set -euxo pipefail
          # Find the latest reconnect lab artifacts directory
          ARTIFACT_DIR=$(find /tmp/kgb-bgp-bfd-reconnect-* -type d -name "artifacts" 2>/dev/null | head -1 || echo "")
          if [[ -n "$ARTIFACT_DIR" ]] && [[ -d "$ARTIFACT_DIR" ]]; then
            echo "Verifying artifacts in: $ARTIFACT_DIR"
            sudo scripts/verify_bgp_reconnect_artifact.sh "$ARTIFACT_DIR"
          else
            echo "WARNING: Could not find reconnect artifacts directory"
            echo "Contents of /tmp/kgb-bgp-bfd-reconnect-*:"
            find /tmp/kgb-bgp-bfd-reconnect-* -type d 2>/dev/null || echo "No directories found"
          fi

      - name: Make lab logs readable
        if: always()
        run: |
          sudo chmod -R a+rX /tmp/kgb-bgp-bfd-reconnect-* 2>/dev/null || true

      - name: Upload lab artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgp-bfd-reconnect-lab-${{ github.run_id }}
          path: |
            /tmp/kgb-bgp-bfd-reconnect-*/artifacts/**
          if-no-files-found: warn
          retention-days: 14
