name: Build and publish UVB-76 opkg package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v; defaults to git tag or dev"
        required: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  GO_VERSION_FILE: "uvb76/go.mod"
  PACKAGE_NAME: "uvb76"

jobs:
  build-opkg:
    name: Build opkg (${{ matrix.opkg_arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - opkg_arch: aarch64-3.10
            goos: linux
            goarch: arm64
            goarm: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      - name: Show Go version
        run: go version

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version || '' }}" ]; then
            version="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "resolved_version=${version}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          cd uvb76
          go test -v ./...

      - name: Build opkg package
        env:
          VERSION: ${{ steps.version.outputs.resolved_version }}
          REVISION: "1"
          OPKG_ARCH: ${{ matrix.opkg_arch }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          bash scripts/build_opkg_package.sh

      - name: List built packages
        run: |
          set -euo pipefail
          echo "=== Built packages ==="
          ls -lh dist/opkg/
          echo ""
          echo "=== Package contents ==="
          for ipk in dist/opkg/*.ipk; do
            echo "--- $ipk ---"
            ar -t "$ipk"
          done

      - name: Verify package
        run: |
          set -euo pipefail
          echo "=== Running self-test ==="
          bash scripts/verify_opkg_package.sh --self-test
          echo ""
          echo "=== Verifying built packages ==="
          for ipk in dist/opkg/*.ipk; do
            echo "Verifying: $ipk"
            bash scripts/verify_opkg_package.sh "$ipk"
          done

      - name: Generate SHA256 manifest
        run: |
          set -euo pipefail
          cat > dist/opkg/manifest.txt << 'EOF'
# UVB-76 opkg Package Manifest
# Generated by GitHub Actions
EOF
          echo "" >> dist/opkg/manifest.txt
          echo "Version: ${{ steps.version.outputs.resolved_version }}" >> dist/opkg/manifest.txt
          echo "Build: ${{ github.run_number }} (${GITHUB_SHA::8})" >> dist/opkg/manifest.txt
          echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> dist/opkg/manifest.txt
          echo "" >> dist/opkg/manifest.txt
          echo "## Packages" >> dist/opkg/manifest.txt
          echo "" >> dist/opkg/manifest.txt
          for ipk in dist/opkg/*.ipk; do
            if [[ "$ipk" == *.ipk ]]; then
              name=$(basename "$ipk")
              sha256=$(sha256sum "$ipk" | cut -d' ' -f1)
              echo "- ${name}" >> dist/opkg/manifest.txt
              echo "  SHA256: ${sha256}" >> dist/opkg/manifest.txt
            fi
          done
          echo "" >> dist/opkg/manifest.txt
          echo "## Installation" >> dist/opkg/manifest.txt
          echo "" >> dist/opkg/manifest.txt
          echo '```bash' >> dist/opkg/manifest.txt
          echo '# Download from GitHub Release assets' >> dist/opkg/manifest.txt
          echo 'opkg install /tmp/uvb76_<version>-1_aarch64-3.10.ipk' >> dist/opkg/manifest.txt
          echo '```' >> dist/opkg/manifest.txt
          cat dist/opkg/manifest.txt

      - name: Generate release notes
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          cat > dist/opkg/release-notes.md << 'EOF'
# UVB-76 v{{VERSION}} Release Notes

**Note:** This is a GitHub Release asset, not a full opkg feed package.
For now, download and install the `.ipk` file directly.

## Target Architecture

- `aarch64-3.10` (ARMv8 / ARM64)

## Prerequisites

- ASUSWRT-Merlin router with Entware installed
- SSH access to the router

## Installation

### 1. Download the package

Download `uvb76_<version>-1_aarch64-3.10.ipk` from this GitHub Release.

### 2. Transfer to router

```bash
scp uvb76_<version>-1_aarch64-3.10.ipk admin@router.local:/tmp/
```

### 3. Install

```bash
ssh admin@router.local
opkg install /tmp/uvb76_<version>-1_aarch64-3.10.ipk
```

The package will:
- Install `uvb76` binary to `/opt/bin/uvb76`
- Install init script to `/opt/etc/init.d/S76uvb76`
- Install example config to `/opt/etc/uvb76/uvb76.json.example`
- Create log directory `/opt/var/log/uvb76/`
- Copy example config to `/opt/etc/uvb76/uvb76.json` (if not already present)

## Configuration

Edit `/opt/etc/uvb76/uvb76.json`:

```json
{
  "listen": {
    "addr": ":8443",
    "tls_cert_file": "/opt/etc/uvb76/cert.pem",
    "tls_key_file": "/opt/etc/uvb76/key.pem"
  },
  "auth": {
    "username": "admin",
    "password_sha256": "sha256:YOUR_SALT:YOUR_HASH"
  },
  ...
}
```

Generate a password hash:

```bash
# On your dev machine
cd KGB/uvb76
go run ./tools/genhash
```

## Service Commands

```bash
# Start the service
/opt/etc/init.d/S76uvb76 start

# Check status
/opt/etc/init.d/S76uvb76 check

# Stop the service
/opt/etc/init.d/S76uvb76 stop

# Restart the service
/opt/etc/init.d/S76uvb76 restart
```

## Logs

Logs are written to `/opt/var/log/uvb76/uvb76.log`.

## Uninstall

```bash
opkg remove uvb76
```

## Troubleshooting

### Service won't start

1. Check if config is valid:
   ```bash
   /opt/bin/uvb76 -config /opt/etc/uvb76/uvb76.json
   ```

2. Check logs:
   ```bash
   cat /opt/var/log/uvb76/uvb76.log
   ```

3. Verify init script is executable:
   ```bash
   chmod +x /opt/etc/init.d/S76uvb76
   ```

### Wrong architecture

Verify your router's architecture:

```bash
opkg print-architecture
uname -m
```

For ARMv7 routers, you may need to build a separate package (armv7hf).

### Config parse failure

Ensure the config is valid JSON. Common issues:
- Trailing commas
- Missing quotes around keys
- Invalid TLS certificate paths

EOF
          # Replace {{VERSION}} with actual version
          sed -i "s/{{VERSION}}/${{ steps.version.outputs.resolved_version }}/g" dist/opkg/release-notes.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: uvb76-opkg-${{ matrix.opkg_arch }}-${{ steps.version.outputs.resolved_version }}
          path: |
            dist/opkg/*.ipk
            dist/opkg/*.sha256
            dist/opkg/manifest.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          
          tag="${GITHUB_REF_NAME}"
          
          # Ensure release notes exist
          if [ ! -f dist/opkg/release-notes.md ]; then
            echo "WARNING: release-notes.md not found, creating minimal notes"
            cat > dist/opkg/release-notes.md << 'EOF'
# UVB-76 Release
EOF
          fi
          
          echo "=== Creating GitHub Release ==="
          echo "Tag: $tag"
          echo "Assets:"
          ls -la dist/opkg/
          
          # Create or update release
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists, uploading assets..."
            # For tag releases, fail closed - do not clobber existing releases
            echo "ERROR: Release ${tag} already exists. Tag releases must be unique." >&2
            exit 1
          else
            echo "Creating new release ${tag}..."
            gh release create "${tag}" dist/opkg/*.ipk dist/opkg/*.sha256 dist/opkg/manifest.txt \
              --title "${tag}" \
              --notes-file "dist/opkg/release-notes.md" \
              --verify-tag
          fi
          
          echo ""
          echo "=== Release published successfully ==="
