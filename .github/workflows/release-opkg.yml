# =============================================================================
# KGB Doctrine: Release barrier enforcement
#
# RULES (enforced by verify-workflow-release-safety.sh):
#   1. Build jobs MUST NOT call gh release create, gh release upload, or gh release edit.
#   2. Only ONE publish job per workflow has contents: write.
#   3. Publish job MUST use `needs` to wait for all build jobs to complete.
#   4. Build jobs upload workflow artifacts only.
#   5. Publish job downloads artifacts, verifies asset set, then publishes.
#
# This workflow produces opkg packages for Entware/AsusWRT-Merlin.
# Tag namespace: uvb76-opkg-v{version}
# =============================================================================

name: Build and publish UVB-76 opkg package

on:
  push:
    tags:
      - "uvb76-opkg-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v; defaults to git tag or dev"
        required: false

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  GO_VERSION_FILE: "uvb76/go.mod"
  PACKAGE_NAME: "uvb76"

# Prevent concurrent release publications for the same tag
concurrency:
  group: opkg-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-opkg:
    name: Build opkg (${{ matrix.opkg_arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - opkg_arch: aarch64-3.10
            goos: linux
            goarch: arm64
            goarm: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      - name: Show Go version
        run: go version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: uvb76/web/package-lock.json

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version || '' }}" ]; then
            version="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "resolved_version=${version}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          cd uvb76
          make test

      - name: Build opkg package
        env:
          VERSION: ${{ steps.version.outputs.resolved_version }}
          REVISION: "1"
          OPKG_ARCH: ${{ matrix.opkg_arch }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          bash scripts/build_opkg_package.sh

      - name: List built packages
        run: |
          set -euo pipefail
          echo "=== Built packages ==="
          ls -lh dist/opkg/
          echo ""
          echo "=== Package contents ==="
          for ipk in dist/opkg/*.ipk; do
            echo "--- $ipk ---"
            tar -tzf "$ipk"
            
            tmp="$(mktemp -d)"
            tar -xzf "$ipk" -C "$tmp"
            echo "=== control.tar.gz contents ==="
            tar -tzf "$tmp/control.tar.gz"
            echo "=== data.tar.gz contents (first 50) ==="
            tar -tzf "$tmp/data.tar.gz" | head -50
            rm -rf "$tmp"
            echo ""
          done

      - name: Verify package
        run: |
          set -euo pipefail
          echo "=== Running self-test ==="
          bash scripts/verify_opkg_package.sh --self-test
          echo ""
          echo "=== Verifying built packages ==="
          for ipk in dist/opkg/*.ipk; do
            echo "Verifying: $ipk"
            bash scripts/verify_opkg_package.sh "$ipk"
          done

      - name: Generate release metadata
        run: |
          set -euo pipefail
          python3 scripts/generate_opkg_release_metadata.py \
            --version "${{ steps.version.outputs.resolved_version }}" \
            --github-run-number "${{ github.run_number }}" \
            --github-sha "${GITHUB_SHA}" \
            --output-dir dist/opkg
          cat dist/opkg/manifest.txt
          echo ""
          cat dist/opkg/release-notes.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: uvb76-opkg-${{ matrix.opkg_arch }}-${{ steps.version.outputs.resolved_version }}
          path: |
            dist/opkg/*.ipk
            dist/opkg/*.sha256
            dist/opkg/manifest.txt
            dist/opkg/release-notes.md
          if-no-files-found: error
          retention-days: 30

  # =============================================================================
  # RELEASE BARRIER JOB
  # Only this job has contents: write permission.
  # This job runs AFTER all build-opkg jobs complete successfully.
  # =============================================================================
  publish-opkg-release:
    name: Publish opkg release
    needs: build-opkg
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: |
          set -euo pipefail
          echo "=== Release assets ==="
          find release-assets -maxdepth 2 -type f | sort

      - name: Verify complete release asset set
        run: |
          set -euo pipefail

          # Verify manifest and release notes exist
          test -f release-assets/manifest.txt
          test -f release-assets/release-notes.md

          echo "=== manifest.txt ==="
          cat release-assets/manifest.txt

          echo ""
          echo "=== release-notes.md (first 50 lines) ==="
          head -50 release-assets/release-notes.md

          # Verify SHA256 checksums exist
          sha_count=$(find release-assets -name '*.sha256' | wc -l)
          if [[ "$sha_count" -eq 0 ]]; then
            echo "ERROR: No SHA256 checksum files found" >&2
            exit 1
          fi
          echo "Found $sha_count SHA256 checksum files"

          # Verify at least one .ipk exists
          ipk_count=$(find release-assets -name '*.ipk' | wc -l)
          if [[ "$ipk_count" -eq 0 ]]; then
            echo "ERROR: No .ipk packages found" >&2
            exit 1
          fi
          echo "Found $ipk_count .ipk packages"

          # Verify SHA256 checksums are valid
          echo ""
          echo "=== Verifying SHA256 checksums ==="
          for sha in release-assets/*.sha256; do
            if sha256sum -c "$sha"; then
              echo "OK: $(basename "$sha")"
            else
              echo "FAIL: $(basename "$sha")" >&2
              exit 1
            fi
          done

          # Prevent cross-product asset leakage (no .deb files in opkg release)
          if find release-assets -type f -name '*.deb' | grep -q .; then
            echo "ERROR: .deb files found in opkg release (cross-product asset leakage)" >&2
            find release-assets -type f -name '*.deb' >&2
            exit 1
          fi

          echo ""
          echo "=== Asset verification PASSED ==="

      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          echo "=== Creating GitHub Release ==="
          echo "Tag: $tag"

          # Check if release already exists (fail closed for tag pushes)
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "ERROR: Release ${tag} already exists. Tag releases must be unique." >&2
            echo "If this is a retry, delete the existing release first." >&2
            exit 1
          fi

          echo "Creating new release ${tag}..."
          gh release create "${tag}" \
            release-assets/*.ipk \
            release-assets/*.sha256 \
            release-assets/manifest.txt \
            release-assets/release-notes.md \
            --title "uvb76 ${tag} opkg" \
            --notes-file "release-assets/release-notes.md" \
            --verify-tag \
            --draft \
            --prerelease \
            --latest=false

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          echo "=== Publishing release ${tag} ==="
          gh release edit "${tag}" --draft=false

          echo ""
          echo "=== Release ${tag} published successfully ==="
          gh release view "${tag}" --json tagName,name,isDraft,isPrerelease,url
