name: Build and publish UVB-76 opkg package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v; defaults to git tag or dev"
        required: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  GO_VERSION_FILE: "uvb76/go.mod"
  PACKAGE_NAME: "uvb76"

jobs:
  build-opkg:
    name: Build opkg (${{ matrix.opkg_arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - opkg_arch: aarch64-3.10
            goos: linux
            goarch: arm64
            goarm: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      - name: Show Go version
        run: go version

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version || '' }}" ]; then
            version="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "resolved_version=${version}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          cd uvb76
          go test -v ./...

      - name: Build opkg package
        env:
          VERSION: ${{ steps.version.outputs.resolved_version }}
          REVISION: "1"
          OPKG_ARCH: ${{ matrix.opkg_arch }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          bash scripts/build_opkg_package.sh

      - name: List built packages
        run: |
          set -euo pipefail
          echo "=== Built packages ==="
          ls -lh dist/opkg/
          echo ""
          echo "=== Package contents ==="
          for ipk in dist/opkg/*.ipk; do
            echo "--- $ipk ---"
            tar -tzf "$ipk"
            
            tmp="$(mktemp -d)"
            tar -xzf "$ipk" -C "$tmp"
            echo "=== control.tar.gz contents ==="
            tar -tzf "$tmp/control.tar.gz"
            echo "=== data.tar.gz contents (first 50) ==="
            tar -tzf "$tmp/data.tar.gz" | head -50
            rm -rf "$tmp"
            echo ""
          done

      - name: Verify package
        run: |
          set -euo pipefail
          echo "=== Running self-test ==="
          bash scripts/verify_opkg_package.sh --self-test
          echo ""
          echo "=== Verifying built packages ==="
          for ipk in dist/opkg/*.ipk; do
            echo "Verifying: $ipk"
            bash scripts/verify_opkg_package.sh "$ipk"
          done

      - name: Generate release metadata
        run: |
          set -euo pipefail
          python3 scripts/generate_opkg_release_metadata.py \
            --version "${{ steps.version.outputs.resolved_version }}" \
            --github-run-number "${{ github.run_number }}" \
            --github-sha "${GITHUB_SHA}" \
            --output-dir dist/opkg
          cat dist/opkg/manifest.txt
          echo ""
          cat dist/opkg/release-notes.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: uvb76-opkg-${{ matrix.opkg_arch }}-${{ steps.version.outputs.resolved_version }}
          path: |
            dist/opkg/*.ipk
            dist/opkg/*.sha256
            dist/opkg/manifest.txt
            dist/opkg/release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          
          tag="${GITHUB_REF_NAME}"
          
          echo "=== Creating GitHub Release ==="
          echo "Tag: $tag"
          echo "Assets:"
          ls -la dist/opkg/
          
          # Create or update release
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists, uploading assets..."
            # For tag releases, fail closed - do not clobber existing releases
            echo "ERROR: Release ${tag} already exists. Tag releases must be unique." >&2
            exit 1
          else
            echo "Creating new release ${tag}..."
            gh release create "${tag}" dist/opkg/*.ipk dist/opkg/*.sha256 dist/opkg/manifest.txt dist/opkg/release-notes.md \
              --title "${tag}" \
              --notes-file "dist/opkg/release-notes.md" \
              --verify-tag
          fi
          
          echo ""
          echo "=== Release published successfully ==="
