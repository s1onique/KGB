name: tovarisch-deb-release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    name: Build Ubuntu 24.04 amd64 deb
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run quality gate
        run: make gate

      - name: Resolve package version
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi

          echo "PACKAGE_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Build deb
        run: |
          VERSION="${PACKAGE_VERSION}" make package-deb

      - name: Smoke-test deb install
        run: |
          sudo apt-get install -y ./dist/tovarisch_*_amd64.deb
          command -v tovarisch
          tovarisch --version
          tovarisch check
          tovarisch status --json

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: tovarisch-deb-amd64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-deb
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download deb artifact
        uses: actions/download-artifact@v4
        with:
          name: tovarisch-deb-amd64
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          gh release create "${tag}" \
            dist/*.deb \
            --title "tovarisch ${tag}" \
            --notes "Rudimentary Ubuntu 24.04 amd64 Debian package for tovarisch." \
          || gh release upload "${tag}" dist/*.deb --clobber

