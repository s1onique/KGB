# =============================================================================
# KGB Doctrine: Release barrier enforcement
#
# RULES (enforced by verify_workflow_release_safety.sh):
#   1. Build jobs MUST NOT call gh release create, gh release upload, or gh release edit.
#   2. Only ONE publish job per workflow has contents: write.
#   3. Publish job MUST use `needs` to wait for all build jobs to complete.
#   4. Build jobs upload workflow artifacts only.
#   5. Publish job downloads artifacts, verifies asset set, then publishes.
#
# This workflow produces Debian packages for Ubuntu 24.04.
# Tag namespace: tovarisch-deb-v{version}
# =============================================================================

name: tovarisch-deb-release

on:
  push:
    branches:
      - main
    tags:
      - "tovarisch-deb-v*"
  pull_request:
  workflow_dispatch:

# Prevent concurrent release publications for the same tag
concurrency:
  group: deb-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cross-platform-verify:
    name: Cross-platform compile gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Cross-platform compile gate is compile-only verification for Linux target.
    # This catches platform-specific API drift in @import("builtin").os.tag branches
    # that would pass macOS local gate but fail on Linux CI.
    # NOTE: Cross-compiled tests cannot execute on non-Linux hosts; compile-only.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Show Zig version
        run: zig version

      - name: Run cross-platform compile gate
        run: make cross-platform-gate

  build-deb:
    name: Build Ubuntu 24.04 amd64 deb
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging and coverage tools
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            dpkg-dev \
            git \
            libcurl4-openssl-dev \
            libdw-dev \
            libelf-dev \
            libiberty-dev \
            zlib1g-dev

          git clone --depth 1 --branch v42 \
            https://github.com/SimonKagstrom/kcov.git \
            /tmp/kcov-src

          cmake -S /tmp/kcov-src -B /tmp/kcov-build \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build /tmp/kcov-build --parallel "$(nproc)"

          sudo cmake --install /tmp/kcov-build

          command -v kcov
          ldd "$(command -v kcov)" || true
          kcov --version

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Show tool versions
        run: |
          zig version
          kcov --version
          dpkg-deb --version

      - name: Run hygiene gate
        timeout-minutes: 3
        run: make hygiene-gate

      - name: Build tovarisch
        timeout-minutes: 3
        run: make tovarisch-build

      - name: Run tovarisch base tests
        timeout-minutes: 3
        run: cd tovarisch && zig build test-base --summary all

      - name: Run tovarisch BFD tests
        timeout-minutes: 3
        run: cd tovarisch && zig build test-bfd --summary all

      - name: Run tovarisch BGP protocol tests
        timeout-minutes: 3
        run: cd tovarisch && zig build test-bgp-protocol --summary all

      - name: Run tovarisch BGP session tests
        timeout-minutes: 3
        run: cd tovarisch && zig build test-bgp-session --summary all

      - name: Compile tovarisch BGP TCP test binary
        timeout-minutes: 3
        run: cd tovarisch && zig build install-test-bgp-tcp --summary all

      - name: Run tovarisch BGP TCP test binary
        timeout-minutes: 1
        run: |
          cd tovarisch
          stdbuf -oL -eL ./zig-out/bin/tovarisch-test-bgp-tcp

      - name: Run tovarisch BGP integration tests
        timeout-minutes: 3
        run: cd tovarisch && zig build test-bgp-integration --summary all

      - name: Run tovarisch HTTP tests
        timeout-minutes: 3
        run: cd tovarisch && zig build test-http --summary all

      - name: Run tovarisch CLI tests
        timeout-minutes: 3
        run: cd tovarisch && zig build test-cli --summary all

      - name: Verify tovarisch status command
        timeout-minutes: 3
        run: make tovarisch-status

      - name: Verify tovarisch status contract
        timeout-minutes: 3
        run: make verify-status-contract

      - name: Resolve package version
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/tovarisch-deb-v* ]]; then
            version="${GITHUB_REF_NAME#tovarisch-deb-v}"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi

          echo "PACKAGE_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Build deb package
        run: |
          VERSION="${PACKAGE_VERSION}" make package-deb

      # Debian package verification is Linux-only because it uses dpkg-deb.
      # This statically verifies payload files (binary, systemd unit) plus
      # control maintainer scripts (postinst, prerm, postrm) using dpkg-deb -x
      # and dpkg-deb -e. No root required, no install, no service start.
      # Uses verify-deb-systemd (not deb-gate) to avoid rebuilding the package.
      - name: Verify deb package (Linux only)
        run: make verify-deb-systemd

      - name: Smoke-test deb install
        run: |
          sudo apt-get install -y ./dist/tovarisch_*_amd64.deb
          command -v tovarisch
          tovarisch --version
          tovarisch check
          tovarisch status --json

      - name: Generate SHA256 checksum
        run: |
          set -euo pipefail
          sha256sum dist/*.deb > dist/tovarisch_amd64.deb.sha256
          cat dist/tovarisch_amd64.deb.sha256

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: tovarisch-deb-amd64
          path: |
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  # =============================================================================
  # RELEASE BARRIER JOB
  # Only this job has contents: write permission.
  # This job runs AFTER all build jobs complete successfully.
  # Creates release as draft, uploads assets, verifies, then publishes.
  # =============================================================================
  publish-release:
    name: Publish GitHub Release
    needs:
      - cross-platform-verify
      - build-deb
    if: startsWith(github.ref, 'refs/tags/tovarisch-deb-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download deb artifact
        uses: actions/download-artifact@v4
        with:
          name: tovarisch-deb-amd64
          path: dist

      - name: List release assets
        run: |
          set -euo pipefail
          echo "=== Release assets ==="
          ls -lh dist/

      - name: Verify release assets
        run: |
          set -euo pipefail

          # Expected assets: 1 .deb + 1 .sha256 = 2 files
          EXPECTED_COUNT=2
          ACTUAL_COUNT=$(find dist -type f \( -name '*.deb' -o -name '*.sha256' \) | wc -l)

          echo "Expected asset count: ${EXPECTED_COUNT}"
          echo "Actual asset count: ${ACTUAL_COUNT}"

          if [[ "${ACTUAL_COUNT}" -ne "${EXPECTED_COUNT}" ]]; then
            echo "ERROR: Expected ${EXPECTED_COUNT} assets, found ${ACTUAL_COUNT}" >&2
            exit 1
          fi

          # Find the .deb file
          deb_file=$(find dist -name '*.deb' -type f)
          if [[ -z "${deb_file}" ]]; then
            echo "ERROR: No .deb file found" >&2
            exit 1
          fi
          echo "Found deb package: $(basename "${deb_file}")"

          # Verify SHA256 checksum exists for the deb
          sha_file=$(find dist -name '*.sha256' -type f)
          if [[ -z "${sha_file}" ]]; then
            echo "ERROR: No SHA256 checksum file found" >&2
            exit 1
          fi
          echo "Found checksum: $(basename "${sha_file}")"

          # Verify SHA256 checksum is valid
          if sha256sum -c "${sha_file}"; then
            echo "SHA256 checksum valid: OK"
          else
            echo "ERROR: SHA256 checksum mismatch" >&2
            exit 1
          fi

          # Prevent cross-product asset leakage (no .ipk files in deb release)
          if find dist -type f -name '*.ipk' | grep -q .; then
            echo "ERROR: .ipk files found in deb release (cross-product asset leakage)" >&2
            exit 1
          fi

          echo ""
          echo "=== Asset verification PASSED ==="

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          echo "=== Creating GitHub Release ==="
          echo "Tag: $tag"

          # Check if release already exists (fail closed for tag pushes)
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "ERROR: Release ${tag} already exists. Tag releases must be unique." >&2
            echo "If this is a retry, delete the existing release first." >&2
            exit 1
          fi

          gh release create "${tag}" \
            dist/*.deb \
            dist/*.sha256 \
            --title "tovarisch ${tag}" \
            --notes "Ubuntu 24.04 amd64 Debian package for tovarisch." \
            --verify-tag \
            --draft \
            --prerelease \
            --latest=false

          echo ""
          echo "=== Draft release created successfully ==="

      - name: Verify draft release and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          echo "=== Verifying draft release ==="

          # Verify release exists and is draft
          is_draft=$(gh release view "${tag}" --json isDraft --jq '.isDraft')
          if [[ "${is_draft}" != "true" ]]; then
            echo "ERROR: Release ${tag} is not a draft" >&2
            exit 1
          fi

          # Verify assets are attached
          asset_count=$(gh release view "${tag}" --json assets --jq '.assets | length')
          if [[ "${asset_count}" -ne 2 ]]; then
            echo "ERROR: Expected 2 assets, found ${asset_count}" >&2
            exit 1
          fi

          echo "Draft release verified: 2 assets attached"

          echo ""
          echo "=== Publishing release ${tag} ==="
          gh release edit "${tag}" --draft=false

          echo ""
          echo "=== Release ${tag} published successfully ==="
          gh release view "${tag}" --json tagName,name,isDraft,isPrerelease,url
