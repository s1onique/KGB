name: UVB-76 Capture Netns Lab

on:
  workflow_dispatch:

jobs:
  uvb76-capture-netns-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ZIG_VERSION: "0.16.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Show Zig version
        run: zig version

      - name: Install lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 jq iputils-ping curl

      - name: Build tovarisch for Linux
        run: |
          cd tovarisch
          zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe

      - name: Run lab
        run: sudo --preserve-env=PATH,TOVARISCH_BINARY make lab-uvb76-capture-netns

      - name: Find result artifact
        id: find-result
        run: |
          RESULT_FILE=$(find /tmp/kgb-uvb76-capture-netns-lab-* -name "result.json" -type f 2>/dev/null | sort -r | head -1)
          if [[ -z "$RESULT_FILE" ]]; then
            echo "ERROR: result.json not found"
            exit 1
          fi
          echo "result_file=$RESULT_FILE" >> $GITHUB_OUTPUT
          echo "artifact_dir=$(dirname $RESULT_FILE)" >> $GITHUB_OUTPUT

      - name: Show result.json
        run: cat "${{ steps.find-result.outputs.result_file }}"

      - name: Verify result
        run: |
          # Check if result.json is valid JSON
          if ! jq . "${{ steps.find-result.outputs.result_file }}" > /dev/null 2>&1; then
            echo "ERROR: result.json is not valid JSON"
            exit 1
          fi

          # Extract contract boolean values
          probe_ready=$(jq -r '.probe_ready' "${{ steps.find-result.outputs.result_file }}")
          phase1_capture_ok=$(jq -r '.contract.phase1_capture_contract_ok' "${{ steps.find-result.outputs.result_file }}")
          phase1_packet_ok=$(jq -r '.contract.phase1_packet_contract_ok' "${{ steps.find-result.outputs.result_file }}")
          phase2_cooldown_ok=$(jq -r '.contract.phase2_cooldown_contract_ok' "${{ steps.find-result.outputs.result_file }}")
          phase3_capture_ok=$(jq -r '.contract.phase3_capture_contract_ok' "${{ steps.find-result.outputs.result_file }}")
          phase3_packet_ok=$(jq -r '.contract.phase3_packet_contract_ok' "${{ steps.find-result.outputs.result_file }}")
          dir_contract_ok=$(jq -r '.contract.dir_contract_ok' "${{ steps.find-result.outputs.result_file }}")
          distinct_event_ids_ok=$(jq -r '.contract.distinct_event_ids_ok' "${{ steps.find-result.outputs.result_file }}")

          echo "Verification:"
          echo "  probe_ready: $probe_ready"
          echo "  phase1_capture_ok: $phase1_capture_ok"
          echo "  phase1_packet_ok: $phase1_packet_ok"
          echo "  phase2_cooldown_ok: $phase2_cooldown_ok"
          echo "  phase3_capture_ok: $phase3_capture_ok"
          echo "  phase3_packet_ok: $phase3_packet_ok"
          echo "  dir_contract_ok: $dir_contract_ok"
          echo "  distinct_event_ids_ok: $distinct_event_ids_ok"

          # Fail if any required check failed
          if [[ "$probe_ready" != "true" ]]; then
            echo "FAIL: probe readiness failed"
            exit 1
          fi
          if [[ "$phase1_capture_ok" != "true" ]]; then
            echo "FAIL: Phase 1 capture contract failed"
            exit 1
          fi
          if [[ "$phase1_packet_ok" != "true" ]]; then
            echo "FAIL: Phase 1 packet contract failed"
            exit 1
          fi
          if [[ "$phase2_cooldown_ok" != "true" ]]; then
            echo "FAIL: Phase 2 cooldown contract failed"
            exit 1
          fi
          if [[ "$phase3_capture_ok" != "true" ]]; then
            echo "FAIL: Phase 3 capture contract failed"
            exit 1
          fi
          if [[ "$phase3_packet_ok" != "true" ]]; then
            echo "FAIL: Phase 3 packet contract failed"
            exit 1
          fi
          if [[ "$dir_contract_ok" != "true" ]]; then
            echo "FAIL: Directory contract verification failed"
            exit 1
          fi
          if [[ "$distinct_event_ids_ok" != "true" ]]; then
            echo "FAIL: Distinct event IDs verification failed"
            exit 1
          fi

          echo "All verification checks passed"

      - name: Make lab logs readable
        if: always()
        run: sudo chmod -R a+rX /tmp/kgb-uvb76-capture-netns-lab-* 2>/dev/null || true

      - name: Run contract verifier self-test
        run: |
          ./scripts/verify_uvb76_diag_packet_contract.sh --self-test

      - name: Run contract verification on artifacts
        run: |
          ARTIFACT_DIR=$(find /tmp/kgb-uvb76-capture-netns-lab-* -type d 2>/dev/null | sort -r | head -1)
          if [[ -z "$ARTIFACT_DIR" ]]; then
            echo "ERROR: No artifact directory found"
            exit 1
          fi
          echo "Verifying artifacts in: $ARTIFACT_DIR"
          
          # Run contract verification - MUST pass for workflow to succeed
          ./scripts/verify_uvb76_diag_packet_contract.sh --dir "$ARTIFACT_DIR"
          
          # Generate contract summaries for each phase (best-effort)
          for phase_row in "$ARTIFACT_DIR"/phase*-spike-row.json; do
            [[ -f "$phase_row" ]] || continue
            PHASE=$(basename "$phase_row" .json)
            echo "Generating contract summary for: $PHASE"
            
            SPIKE_ROW="$phase_row"
            PACKET_FILE="${phase_row/spike-row/capture-packet}"
            OUTPUT_FILE="${phase_row/spike-row/capture-contract}.json"
            
            if [[ -f "$PACKET_FILE" ]]; then
              ./scripts/verify_uvb76_diag_packet_contract.sh \
                --row "$SPIKE_ROW" \
                --capture "$PACKET_FILE" \
                --phase "$PHASE" \
                --output "$OUTPUT_FILE" || true
            else
              ./scripts/verify_uvb76_diag_packet_contract.sh \
                --row "$SPIKE_ROW" \
                --phase "$PHASE" \
                --output "$OUTPUT_FILE" || true
            fi
          done

      - name: Upload lab logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uvb76-capture-netns-lab-logs
          path: |
            /tmp/kgb-uvb76-capture-netns-lab-*/**
            /tmp/kgb-uvb76-capture-netns-lab-*/*.json
            /tmp/kgb-uvb76-capture-netns-lab-*/*.txt
            /tmp/kgb-uvb76-capture-netns-lab-*/*.log
          retention-days: 14

