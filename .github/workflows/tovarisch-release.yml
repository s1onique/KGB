name: Build and publish tovarisch binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIG_VERSION: "0.16.0"
  BINARY_NAME: "tovarisch"
  ZIG_PROJECT_DIR: "tovarisch"

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - zig_target: x86_64-linux-musl
            asset_name: tovarisch-linux-amd64
          - zig_target: aarch64-linux-musl
            asset_name: tovarisch-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Show Zig version
        run: zig version

      - name: Install zig-kcov
        env:
          ZIG_KCOV_VERSION: v42.0.1
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y bc jq git unzip curl

          tool_dir="$RUNNER_TEMP/zig-kcov-tools"
          mkdir -p "$tool_dir"

          api_url="https://api.github.com/repos/roc-lang/zig-kcov/releases/tags/${ZIG_KCOV_VERSION}"

          # Debug: print all available asset names to diagnose selection issues
          echo "=== Debug: All release assets for ${ZIG_KCOV_VERSION} ==="
          curl -fsSL "$api_url" | jq -r '.assets[].name' || echo "Could not list assets"
          echo ""

          asset_url="$(
            curl -fsSL "$api_url" |
              jq -r '
                .assets[]
                | select(
                    (.name | test("linux"; "i")) and
                    (.name | test("x86_64|amd64"; "i"))
                  )
                | .browser_download_url
              ' |
              head -n 1
          )"

          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "Could not find linux x86_64 zig-kcov asset in ${ZIG_KCOV_VERSION}" >&2
            echo "=== Debug: All assets from release ===" >&2
            curl -fsSL "$api_url" | jq -r '.assets[].name' >&2
            exit 1
          fi

          echo "Downloading zig-kcov from: $asset_url"
          curl -fL "$asset_url" -o /tmp/zig-kcov-release

          echo "=== File type of downloaded asset ==="
          file /tmp/zig-kcov-release || true
          ls -l /tmp/zig-kcov-release || true

          case "$asset_url" in
            *.tar.gz|*.tgz)
              mkdir -p /tmp/zig-kcov-unpack
              tar -xzf /tmp/zig-kcov-release -C /tmp/zig-kcov-unpack
              found="$(find /tmp/zig-kcov-unpack -type f \( -name 'zig-kcov' -o -name 'kcov' \) | head -n 1)"
              ;;
            *.zip)
              mkdir -p /tmp/zig-kcov-unpack
              unzip -q /tmp/zig-kcov-release -d /tmp/zig-kcov-unpack
              found="$(find /tmp/zig-kcov-unpack -type f \( -name 'zig-kcov' -o -name 'kcov' \) | head -n 1)"
              ;;
            *)
              found="/tmp/zig-kcov-release"
              ;;
          esac

          if [ -z "${found:-}" ] || [ ! -f "$found" ]; then
            echo "Downloaded asset did not contain zig-kcov/kcov executable" >&2
            find /tmp/zig-kcov-unpack -maxdepth 4 -type f 2>/dev/null >&2 || true
            exit 1
          fi

          cp "$found" "$tool_dir/zig-kcov"
          chmod +x "$tool_dir/zig-kcov"

          echo "=== zig-kcov executable diagnostics ==="
          echo "File info:"
          file "$tool_dir/zig-kcov" || true
          ls -l "$tool_dir/zig-kcov" || true

          echo "Dynamic library dependencies (ldd):"
          ldd "$tool_dir/zig-kcov" 2>&1 || echo "ldd failed or not applicable"

          echo "zig-kcov --help:"
          set +e
          "$tool_dir/zig-kcov" --help > /tmp/zig-kcov-help-inline.txt 2>&1
          help_rc=$?
          set -e
          echo "zig-kcov --help rc=$help_rc"
          head -40 /tmp/zig-kcov-help-inline.txt || true

          echo "zig-kcov --version:"
          "$tool_dir/zig-kcov" --version 2>&1 || echo "zig-kcov --version exited non-zero: rc=$?"

          # Smoke test with harmless invocation (non-fatal under set -e)
          echo "=== zig-kcov smoke test ==="
          set +e
          "$tool_dir/zig-kcov" --help > /tmp/zig-kcov-help.txt 2>&1
          sm_rc=$?
          set -e
          echo "smoke test rc=$sm_rc"
          head -40 /tmp/zig-kcov-help.txt || true

          # Check for missing shared libraries (diagnostic only, do not auto-install)
          missing_libs=$(ldd "$tool_dir/zig-kcov" 2>&1 | grep "not found" || true)
          if [ -n "$missing_libs" ]; then
            echo "=== WARNING: Missing shared libraries detected ==="
            echo "$missing_libs"
            echo "Install the missing runtime libraries on the runner before retrying."
          fi

          # Minimal smoke: try to cover /bin/true (not the project binary)
          # This distinguishes "zig-kcov is broken" from "Zig test binary + kcov incompatibility"
          echo "=== zig-kcov backend smoke (cover /bin/true) ==="
          tmp_cov="$RUNNER_TEMP/zig-kcov-smoke"
          rm -rf "$tmp_cov"
          set +e
          "$tool_dir/zig-kcov" "$tmp_cov" /bin/true > /tmp/zig-kcov-smoke.out 2>&1
          sm_cov_rc=$?
          set -e
          echo "zig-kcov /bin/true rc=$sm_cov_rc"
          head -80 /tmp/zig-kcov-smoke.out || true
          echo "Smoke output files:"
          find "$tmp_cov" -maxdepth 3 -type f 2>/dev/null | sort | head -50 || echo "none found"

          # If zig-kcov itself is not runnable (not a valid ELF or missing libs), abort before gate
          if [ ! -x "$tool_dir/zig-kcov" ]; then
            echo "FATAL: zig-kcov is not executable. Check above diagnostics." >&2
            exit 1
          fi

          echo "=== zig-kcov installation complete ==="
          test -x "$tool_dir/zig-kcov" || exit 1

          echo "KCOV_BIN=$tool_dir/zig-kcov" >> "$GITHUB_ENV"

      - name: Run quality gate
        run: make gate

      - name: Build release binary
        run: |
          set -euo pipefail

          cd "${ZIG_PROJECT_DIR}"

          zig build \
            -Dtarget=${{ matrix.zig_target }} \
            -Doptimize=ReleaseSafe

          cd ..

          mkdir -p dist
          cp "${ZIG_PROJECT_DIR}/zig-out/bin/${BINARY_NAME}" "dist/${{ matrix.asset_name }}"
          chmod +x "dist/${{ matrix.asset_name }}"

      - name: Verify binary exists
        run: |
          set -euo pipefail

          test -s "dist/${{ matrix.asset_name }}"
          file "dist/${{ matrix.asset_name }}"
          sha256sum "dist/${{ matrix.asset_name }}" > "dist/${{ matrix.asset_name }}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.asset_name }}
            dist/${{ matrix.asset_name }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: List release assets
        run: |
          set -euo pipefail
          find dist-artifacts -maxdepth 2 -type f -print | sort

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          SHORT_SHA="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          TAG_NAME="build-${SHORT_SHA}"

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists"
          else
            gh release create "${TAG_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "${TAG_NAME}" \
              --notes "tovarisch build from ${GITHUB_SHA}" \
              --prerelease
          fi

          gh release upload "${TAG_NAME}" \
            dist-artifacts/tovarisch-linux-amd64 \
            dist-artifacts/tovarisch-linux-amd64.sha256 \
            dist-artifacts/tovarisch-linux-arm64 \
            dist-artifacts/tovarisch-linux-arm64.sha256 \
            --clobber
