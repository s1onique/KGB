name: Build and publish tovarisch binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIG_VERSION: "0.16.0"
  BINARY_NAME: "tovarisch"
  ZIG_PROJECT_DIR: "tovarisch"

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - zig_target: x86_64-linux-musl
            asset_name: tovarisch-linux-amd64
          - zig_target: aarch64-linux-musl
            asset_name: tovarisch-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Show Zig version
        run: zig version

      - name: Install zig-kcov
        env:
          ZIG_KCOV_VERSION: v42.0.1
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y bc jq git unzip curl

          mkdir -p "$GITHUB_WORKSPACE/.tools"

          api_url="https://api.github.com/repos/roc-lang/zig-kcov/releases/tags/${ZIG_KCOV_VERSION}"
          asset_url="$(
            curl -fsSL "$api_url" |
              jq -r '
                .assets[]
                | select(
                    (.name | test("linux"; "i")) and
                    (.name | test("x86_64|amd64"; "i"))
                  )
                | .browser_download_url
              ' |
              head -n 1
          )"

          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "Could not find linux x86_64 zig-kcov asset in ${ZIG_KCOV_VERSION}" >&2
            curl -fsSL "$api_url" | jq -r '.assets[].name' >&2
            exit 1
          fi

          echo "Downloading zig-kcov from: $asset_url"
          curl -fL "$asset_url" -o /tmp/zig-kcov-release
          file /tmp/zig-kcov-release || true

          case "$asset_url" in
            *.tar.gz|*.tgz)
              mkdir -p /tmp/zig-kcov-unpack
              tar -xzf /tmp/zig-kcov-release -C /tmp/zig-kcov-unpack
              found="$(find /tmp/zig-kcov-unpack -type f \( -name 'zig-kcov' -o -name 'kcov' \) | head -n 1)"
              ;;
            *.zip)
              mkdir -p /tmp/zig-kcov-unpack
              unzip -q /tmp/zig-kcov-release -d /tmp/zig-kcov-unpack
              found="$(find /tmp/zig-kcov-unpack -type f \( -name 'zig-kcov' -o -name 'kcov' \) | head -n 1)"
              ;;
            *)
              found="/tmp/zig-kcov-release"
              ;;
          esac

          if [ -z "${found:-}" ] || [ ! -f "$found" ]; then
            echo "Downloaded asset did not contain zig-kcov/kcov executable" >&2
            find /tmp/zig-kcov-unpack -maxdepth 4 -type f 2>/dev/null >&2 || true
            exit 1
          fi

          cp "$found" "$GITHUB_WORKSPACE/.tools/zig-kcov"
          chmod +x "$GITHUB_WORKSPACE/.tools/zig-kcov"

          echo "=== zig-kcov installation verification ==="
          test -x "$GITHUB_WORKSPACE/.tools/zig-kcov" || exit 1
          "$GITHUB_WORKSPACE/.tools/zig-kcov" --version || true

          echo "KCOV_BIN=$GITHUB_WORKSPACE/.tools/zig-kcov" >> "$GITHUB_ENV"

      - name: Run quality gate
        run: make gate

      - name: Build release binary
        run: |
          set -euo pipefail

          cd "${ZIG_PROJECT_DIR}"

          zig build \
            -Dtarget=${{ matrix.zig_target }} \
            -Doptimize=ReleaseSafe

          cd ..

          mkdir -p dist
          cp "${ZIG_PROJECT_DIR}/zig-out/bin/${BINARY_NAME}" "dist/${{ matrix.asset_name }}"
          chmod +x "dist/${{ matrix.asset_name }}"

      - name: Verify binary exists
        run: |
          set -euo pipefail

          test -s "dist/${{ matrix.asset_name }}"
          file "dist/${{ matrix.asset_name }}"
          sha256sum "dist/${{ matrix.asset_name }}" > "dist/${{ matrix.asset_name }}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.asset_name }}
            dist/${{ matrix.asset_name }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: List release assets
        run: |
          set -euo pipefail
          find dist-artifacts -maxdepth 2 -type f -print | sort

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          SHORT_SHA="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          TAG_NAME="build-${SHORT_SHA}"

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists"
          else
            gh release create "${TAG_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "${TAG_NAME}" \
              --notes "tovarisch build from ${GITHUB_SHA}" \
              --prerelease
          fi

          gh release upload "${TAG_NAME}" \
            dist-artifacts/tovarisch-linux-amd64 \
            dist-artifacts/tovarisch-linux-amd64.sha256 \
            dist-artifacts/tovarisch-linux-arm64 \
            dist-artifacts/tovarisch-linux-arm64.sha256 \
            --clobber
