name: Build and publish tovarisch binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIG_VERSION: "0.16.0"
  BINARY_NAME: "tovarisch"
  ZIG_PROJECT_DIR: "tovarisch"

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - zig_target: x86_64-linux-musl
            asset_name: tovarisch-linux-amd64
          - zig_target: aarch64-linux-musl
            asset_name: tovarisch-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Show Zig version
        run: zig version

      - name: Install zig-kcov from source
        env:
          ZIG_KCOV_VERSION: v42.0.1
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y bc jq git unzip curl binutils

          tool_dir="$RUNNER_TEMP/zig-kcov-tools"
          mkdir -p "$tool_dir"

          # Build zig-kcov from source to avoid SIGILL from prebuilt binaries
          # Prebuilt assets may use CPU features unavailable on GitHub runner CPUs
          echo "=== Cloning zig-kcov from source ==="
          git clone --depth 1 --branch "${ZIG_KCOV_VERSION}" \
            https://github.com/roc-lang/zig-kcov.git \
            /tmp/zig-kcov-src
          cd /tmp/zig-kcov-src

          echo "=== Inspecting build files ==="
          ls -la
          cat build.zig 2>/dev/null | head -50 || echo "No build.zig found"

          echo "=== Building zig-kcov ==="
          # Build for Linux x86_64 target (native to the runner)
          # Use ReleaseSafe to avoid aggressive optimizations that may use CPU-specific instructions
          # This prevents SIGILL on runners with older CPU feature sets
          zig build -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseSafe

          # Find the built binary
          found="$(find zig-out -type f \( -name 'zig-kcov' -o -name 'kcov' \) 2>/dev/null | head -n 1)"

          if [ -z "${found:-}" ] || [ ! -f "$found" ]; then
            echo "Build did not produce zig-kcov/kcov binary" >&2
            find zig-out -type f 2>/dev/null >&2 || true
            exit 1
          fi

          # Rename to kcov (matches the actual binary name from upstream)
          cp "$found" "$tool_dir/kcov"
          chmod +x "$tool_dir/kcov"

          echo "=== kcov executable diagnostics ==="
          echo "File info:"
          file "$tool_dir/kcov" || true
          ls -l "$tool_dir/kcov" || true

          echo "Dynamic library dependencies (ldd):"
          ldd "$tool_dir/kcov" 2>&1 || echo "ldd failed or not applicable"

          echo "kcov --help:"
          set +e
          "$tool_dir/kcov" --help > /tmp/kcov-help-inline.txt 2>&1
          help_rc=$?
          set -e
          echo "kcov --help rc=$help_rc"
          head -40 /tmp/kcov-help-inline.txt || true

          echo "kcov --version:"
          "$tool_dir/kcov" --version 2>&1 || echo "kcov --version exited non-zero: rc=$?"

          # Smoke test with harmless invocation (non-fatal under set -e)
          echo "=== kcov smoke test ==="
          set +e
          "$tool_dir/kcov" --help > /tmp/kcov-help.txt 2>&1
          sm_rc=$?
          set -e
          echo "smoke test rc=$sm_rc"
          head -40 /tmp/kcov-help.txt || true

          # Check for missing shared libraries (diagnostic only)
          missing_libs=$(ldd "$tool_dir/kcov" 2>&1 | grep "not found" || true)
          if [ -n "$missing_libs" ]; then
            echo "=== WARNING: Missing shared libraries detected ==="
            echo "$missing_libs"
            echo "Install the missing runtime libraries on the runner before retrying."
          fi

          # Minimal smoke: try to cover /bin/true (not the project binary)
          # This distinguishes "kcov is broken" from "Zig test binary + kcov incompatibility"
          echo "=== kcov backend smoke (cover /bin/true) ==="
          tmp_cov="$RUNNER_TEMP/kcov-smoke"
          rm -rf "$tmp_cov"
          set +e
          "$tool_dir/kcov" "$tmp_cov" /bin/true > /tmp/kcov-smoke.out 2>&1
          sm_cov_rc=$?
          set -e
          echo "kcov /bin/true rc=$sm_cov_rc"
          head -80 /tmp/kcov-smoke.out || true
          echo "Smoke output files:"
          find "$tmp_cov" -maxdepth 3 -type f 2>/dev/null | sort | head -50 || echo "none found"

          # If kcov itself is not runnable, abort before gate
          if [ ! -x "$tool_dir/kcov" ]; then
            echo "FATAL: kcov is not executable. Check above diagnostics." >&2
            exit 1
          fi

          echo "=== kcov source build complete ==="
          test -x "$tool_dir/kcov" || exit 1

          echo "KCOV_BIN=$tool_dir/kcov" >> "$GITHUB_ENV"

      - name: Run quality gate
        run: make gate

      - name: Build release binary
        run: |
          set -euo pipefail

          cd "${ZIG_PROJECT_DIR}"

          zig build \
            -Dtarget=${{ matrix.zig_target }} \
            -Doptimize=ReleaseSafe

          cd ..

          mkdir -p dist
          cp "${ZIG_PROJECT_DIR}/zig-out/bin/${BINARY_NAME}" "dist/${{ matrix.asset_name }}"
          chmod +x "dist/${{ matrix.asset_name }}"

      - name: Verify binary exists
        run: |
          set -euo pipefail

          test -s "dist/${{ matrix.asset_name }}"
          file "dist/${{ matrix.asset_name }}"
          sha256sum "dist/${{ matrix.asset_name }}" > "dist/${{ matrix.asset_name }}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.asset_name }}
            dist/${{ matrix.asset_name }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: List release assets
        run: |
          set -euo pipefail
          find dist-artifacts -maxdepth 2 -type f -print | sort

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          SHORT_SHA="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          TAG_NAME="build-${SHORT_SHA}"

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists"
          else
            gh release create "${TAG_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "${TAG_NAME}" \
              --notes "tovarisch build from ${GITHUB_SHA}" \
              --prerelease
          fi

          gh release upload "${TAG_NAME}" \
            dist-artifacts/tovarisch-linux-amd64 \
            dist-artifacts/tovarisch-linux-amd64.sha256 \
            dist-artifacts/tovarisch-linux-arm64 \
            dist-artifacts/tovarisch-linux-arm64.sha256 \
            --clobber
