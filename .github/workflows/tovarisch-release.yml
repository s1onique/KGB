# =============================================================================
# KGB Doctrine: Release barrier enforcement
#
# RULES (enforced by verify_workflow_release_safety.sh):
#   1. Build jobs MUST NOT call gh release create, gh release upload, or gh release edit.
#   2. Only ONE publish job per workflow has contents: write.
#   3. Publish job MUST use `needs` to wait for all build jobs to complete.
#   4. Build jobs upload workflow artifacts only.
#   5. Publish job downloads artifacts, verifies asset set, then publishes.
#
# This workflow builds tovarisch binaries for Linux (amd64, arm64).
# Tag namespace: tovarisch-build-{sha7}
# Prereleases are created on every main push with unique per-SHA tags.
# =============================================================================

name: Build and publish tovarisch binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent release publications for the same tag
concurrency:
  group: tovarisch-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"
  BINARY_NAME: "tovarisch"
  ZIG_PROJECT_DIR: "tovarisch"

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - zig_target: x86_64-linux-musl
            asset_name: tovarisch-linux-amd64
          - zig_target: aarch64-linux-musl
            asset_name: tovarisch-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Show Zig version
        run: zig version

      - name: Source policy hygiene gate
        run: make hygiene-gate

      - name: Build tovarisch
        run: make tovarisch-build

      - name: Run tovarisch base tests
        timeout-minutes: 3
        run: cd tovarisch && zig build test-base --summary all

      - name: Run tovarisch BFD tests
        timeout-minutes: 3
        run: cd tovarisch && zig build test-bfd --summary all

      - name: Run tovarisch BGP protocol tests
        timeout-minutes: 3
        run: cd tovarisch && zig build test-bgp-protocol --summary all

      - name: Run tovarisch BGP session tests
        timeout-minutes: 3
        run: cd tovarisch && zig build test-bgp-session --summary all

      - name: Compile tovarisch BGP TCP test binary
        timeout-minutes: 3
        run: cd tovarisch && zig build install-test-bgp-tcp --summary all

      - name: Run tovarisch BGP TCP test binary
        timeout-minutes: 1
        run: |
          cd tovarisch
          stdbuf -oL -eL ./zig-out/bin/tovarisch-test-bgp-tcp

      - name: Run tovarisch BGP integration tests
        timeout-minutes: 3
        run: cd tovarisch && zig build test-bgp-integration --summary all

      - name: Run tovarisch HTTP tests
        timeout-minutes: 3
        run: cd tovarisch && zig build test-http --summary all

      - name: Run tovarisch CLI tests
        timeout-minutes: 3
        run: cd tovarisch && zig build test-cli --summary all

      - name: Verify tovarisch status contract
        run: make verify-status-contract

      # Runtime smoke tests execute the built binary and must only run for targets
      # executable on the GitHub runner (x86_64). ARM64 cross-compiled artifacts
      # would require QEMU/binfmt support to test in CI.
      - name: Native Linux runtime path smoke tests
        if: matrix.zig_target == 'x86_64-linux-musl'
        run: |
          set -euo pipefail
          
          # Build the Linux binary first if not already built
          cd "${ZIG_PROJECT_DIR}"
          zig build -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseSafe
          cd ..
          
          # Run the Linux smoke tests against the built binary
          ./scripts/linux_smoke_test.sh "${ZIG_PROJECT_DIR}/zig-out/bin/${BINARY_NAME}"

      - name: Build release binary
        run: |
          set -euo pipefail

          cd "${ZIG_PROJECT_DIR}"

          zig build \
            -Dtarget=${{ matrix.zig_target }} \
            -Doptimize=ReleaseSafe

          cd ..

          mkdir -p dist
          cp "${ZIG_PROJECT_DIR}/zig-out/bin/${BINARY_NAME}" "dist/${{ matrix.asset_name }}"
          chmod +x "dist/${{ matrix.asset_name }}"

      - name: Verify binary exists
        run: |
          set -euo pipefail

          test -s "dist/${{ matrix.asset_name }}"
          file "dist/${{ matrix.asset_name }}"
          sha256sum "dist/${{ matrix.asset_name }}" > "dist/${{ matrix.asset_name }}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.asset_name }}
            dist/${{ matrix.asset_name }}.sha256
          if-no-files-found: error
          retention-days: 30

  # =============================================================================
  # RELEASE BARRIER JOB
  # Only this job has contents: write permission.
  # This job runs AFTER all build jobs complete successfully.
  # Creates release as draft, uploads assets, verifies, then publishes.
  # =============================================================================
  publish:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: List release assets
        run: |
          set -euo pipefail
          echo "=== Release assets ==="
          find dist-artifacts -maxdepth 2 -type f | sort

      - name: Verify release assets
        run: |
          set -euo pipefail

          # Expected asset count based on matrix: 2 binaries + 2 checksums = 4 files
          EXPECTED_COUNT=4
          ACTUAL_COUNT=$(find dist-artifacts -type f | wc -l)

          echo "Expected asset count: ${EXPECTED_COUNT}"
          echo "Actual asset count: ${ACTUAL_COUNT}"

          if [[ "${ACTUAL_COUNT}" -ne "${EXPECTED_COUNT}" ]]; then
            echo "ERROR: Expected ${EXPECTED_COUNT} assets, found ${ACTUAL_COUNT}" >&2
            echo "Missing assets - build jobs may have failed or not uploaded" >&2
            exit 1
          fi

          # Verify both binaries exist
          test -f dist-artifacts/tovarisch-linux-amd64
          test -f dist-artifacts/tovarisch-linux-amd64.sha256
          test -f dist-artifacts/tovarisch-linux-arm64
          test -f dist-artifacts/tovarisch-linux-arm64.sha256

          echo ""
          echo "All expected binary assets present: OK"

          # Verify SHA256 checksums are valid
          for sha in dist-artifacts/*.sha256; do
            if sha256sum -c "$sha"; then
              echo "OK: $(basename "$sha")"
            else
              echo "FAIL: $(basename "$sha")" >&2
              exit 1
            fi
          done

          # Prevent cross-product asset leakage (no .deb or .ipk in binary release)
          if find dist-artifacts -type f \( -name '*.deb' -o -name '*.ipk' \) | grep -q .; then
            echo "ERROR: Package files found in binary release (cross-product asset leakage)" >&2
            exit 1
          fi

          echo ""
          echo "=== Asset verification PASSED ==="

      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          SHORT_SHA="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          TAG_NAME="tovarisch-build-${SHORT_SHA}"

          echo "=== Creating GitHub Release ==="
          echo "Tag: $TAG_NAME"

          # Check if release already exists - fail closed for deterministic per-SHA tags
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "ERROR: Release ${TAG_NAME} already exists." >&2
            echo "This workflow uses unique per-SHA tags; existing release indicates a workflow bug." >&2
            exit 1
          fi

          echo "Creating new release ${TAG_NAME} with assets..."
          gh release create "${TAG_NAME}" \
            dist-artifacts/tovarisch-linux-amd64 \
            dist-artifacts/tovarisch-linux-amd64.sha256 \
            dist-artifacts/tovarisch-linux-arm64 \
            dist-artifacts/tovarisch-linux-arm64.sha256 \
            --target "${GITHUB_SHA}" \
            --title "${TAG_NAME}" \
            --notes "tovarisch build from ${GITHUB_SHA}" \
            --draft \
            --prerelease \
            --latest=false

          echo ""
          echo "=== Draft release created successfully ==="

      - name: Verify draft release and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SHORT_SHA="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          TAG_NAME="tovarisch-build-${SHORT_SHA}"

          echo "=== Verifying draft release ==="

          # Verify release exists and is draft
          is_draft=$(gh release view "${TAG_NAME}" --json isDraft --jq '.isDraft')
          if [[ "${is_draft}" != "true" ]]; then
            echo "ERROR: Release ${TAG_NAME} is not a draft" >&2
            exit 1
          fi

          # Verify assets are attached
          asset_count=$(gh release view "${TAG_NAME}" --json assets --jq '.assets | length')
          if [[ "${asset_count}" -ne 4 ]]; then
            echo "ERROR: Expected 4 assets, found ${asset_count}" >&2
            exit 1
          fi

          echo "Draft release verified: 4 assets attached"

          echo ""
          echo "=== Publishing release ${TAG_NAME} ==="
          gh release edit "${TAG_NAME}" --draft=false

          echo ""
          echo "=== Release ${TAG_NAME} published successfully ==="
          gh release view "${TAG_NAME}" --json tagName,name,isDraft,isPrerelease,url,assets
