name: Build and publish tovarisch binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIG_VERSION: "0.16.0"
  BINARY_NAME: "tovarisch"

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - zig_target: x86_64-linux-musl
            asset_name: tovarisch-linux-amd64
          - zig_target: aarch64-linux-musl
            asset_name: tovarisch-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Show Zig version
        run: zig version

      - name: Run quality gate
        run: make gate

      - name: Build release binary
        run: |
          set -euo pipefail

          zig build \
            -Dtarget=${{ matrix.zig_target }} \
            -Doptimize=ReleaseSafe

          mkdir -p dist
          cp "zig-out/bin/${BINARY_NAME}" "dist/${{ matrix.asset_name }}"
          chmod +x "dist/${{ matrix.asset_name }}"

      - name: Verify binary exists
        run: |
          set -euo pipefail

          test -s "dist/${{ matrix.asset_name }}"
          file "dist/${{ matrix.asset_name }}"
          sha256sum "dist/${{ matrix.asset_name }}" > "dist/${{ matrix.asset_name }}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.asset_name }}
            dist/${{ matrix.asset_name }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: List release assets
        run: |
          set -euo pipefail
          find dist-artifacts -maxdepth 2 -type f -print | sort

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SHORT_SHA="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          TAG_NAME="build-${SHORT_SHA}"

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists"
          else
            gh release create "${TAG_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "${TAG_NAME}" \
              --notes "tovarisch build from ${GITHUB_SHA}" \
              --prerelease
          fi

          gh release upload "${TAG_NAME}" \
            dist-artifacts/tovarisch-linux-amd64 \
            dist-artifacts/tovarisch-linux-amd64.sha256 \
            dist-artifacts/tovarisch-linux-arm64 \
            dist-artifacts/tovarisch-linux-arm64.sha256 \
            --clobber
