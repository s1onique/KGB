# UVB-76 Memory Budget — Go Control Tower
#
# Memory budgets are explicit product contracts for UVB-76.
# Values marked "baseline_required" must be measured before being set.
#
# Reference: kgb://doctrine/embedded-memory-frugality

version: "1.0"
service: uvb76
description: |
  Memory budgets for the UVB-76 Go control tower daemon.
  These budgets establish RSS/PSS limits for various operational states.

# GitHub-hosted CI idle baselines (first green run 28013478727)
# These are WARNING-ONLY thresholds from first measurement; router/embedded baselines remain required
ci_idle_baselines:
  github_hosted_ubuntu:
    # First green run: workflow 28013478727, artifact 7815736986
    # Values are guidance only; router/embedded remain baseline_required
    idle:
      rss_kib: 11784
      pss_kib: 11776
      growth_rss_kib: 0
      growth_percent: 0.0
      warning_threshold_rss_kib: 18000
      notes: |
        First GitHub-hosted idle baseline. Warning-only (fail_on_budget_exceeded: false).
        Source: workflow run 28013478727, artifact uvb76-memory-lab (ID 7815736986).
        Router/embedded hardware baselines remain baseline_required.
    evidence_sources:
      - workflow_run: 28013478727
        artifact_id: 7815736986
        artifact_name: uvb76-memory-lab
        service_version: "1.0.0"
        service_commit: "642befe"
        workload: uvb76-idle-warmup
        duration_seconds: 120
        environment_label: github_hosted_ubuntu

# GitHub-hosted CI leak-slope thresholds (WARNING-ONLY)
# Leak-slope thresholds detect memory growth patterns under repeated requests.
# These are WARNING-ONLY thresholds; no real leak-slope evidence artifact exists yet.
# Run Memory Lab with leak-slope inputs enabled to generate actual baselines.
ci_leak_slope_thresholds:
  github_hosted_ubuntu:
    # Proposed warning thresholds for leak-slope detection
    # slope is measured in KiB/minute
    evidence_status: proposed_thresholds
    uvb76_leak_slope:
      rss_slope_warning_kib_per_min: 200.0
      pss_slope_warning_kib_per_min: 180.0
      max_growth_kib: 1000
      notes: |
        Proposed warning-only threshold. No real leak-slope artifact yet.
        Run Memory Lab workflow with run_uvb76_leak_slope=true to generate real baseline.
        Router/embedded leak-slope baselines remain baseline_required.
    uvb76_leak_slope_netdiag:
      rss_slope_warning_kib_per_min: 300.0
      pss_slope_warning_kib_per_min: 250.0
      max_growth_kib: 1500
      notes: |
        Proposed warning-only threshold. No real leak-slope artifact yet.
        Run Memory Lab workflow with run_uvb76_leak_slope_netdiag=true to generate real baseline.
        Router/embedded leak-slope baselines remain baseline_required.

# Architecture-specific budgets
arch_budgets:
  linux/arm64:
    # Idle state — after initial startup, no active probing
    idle:
      rss_kib: baseline_required
      pss_kib: baseline_required
      heap_alloc_bytes: baseline_required
      goroutines_max: baseline_required
      notes: Run make lab-uvb76-memory to generate real baseline

    # Warm steady-state — with active probing and collection
    warm:
      rss_kib: baseline_required
      pss_kib: baseline_required
      heap_alloc_bytes: baseline_required
      goroutines_max: baseline_required
      growth_allowed_kib: baseline_required
      notes: Run make lab-uvb76-memory to generate real baseline

    # Hot-path allocation budgets (per-call)
    hot_paths:
      status_api:
        alloc_bytes_max: baseline_required
        notes: Maximum allocation during /api/v1/status render
      diagnostic_capture:
        alloc_bytes_max: baseline_required
        notes: Maximum allocation during diagnostic packet capture
      icmp_probe:
        alloc_bytes_max: baseline_required
        notes: Maximum allocation per ICMP probe cycle
      tcp_quality_collector:
        alloc_bytes_max: baseline_required
        notes: Maximum allocation per TCP quality sample
      route_collector:
        alloc_bytes_max: baseline_required
        notes: Maximum allocation per route collection cycle
      spike_diagnostics:
        alloc_bytes_max: baseline_required
        notes: Maximum allocation per spike diagnostic render

    # History and artifact caps
    history:
      max_retained_targets: 1000
      max_retained_results: 10000
      max_diagnostic_buffer_kib: 512
      max_log_buffer_mb: 10
      notes: Explicit retention limits to prevent unbounded growth

    # Max response/artifact sizes
    max_response:
      status_json_kib: 256
      diagnostic_packet_kib: 128
      notes: Bounded response sizes; must not grow unbounded

  linux/amd64:
    idle:
      rss_kib: baseline_required
      pss_kib: baseline_required
    warm:
      rss_kib: baseline_required
      pss_kib: baseline_required
      growth_allowed_kib: baseline_required

  darwin/arm64:
    # macOS development builds may have higher baseline
    idle:
      rss_kib: baseline_required
      pss_kib: baseline_required
    warm:
      rss_kib: baseline_required
      pss_kib: baseline_required
      growth_allowed_kib: baseline_required

# Workload-specific budgets for memory labs
workload_budgets:
  status_api_polling:
    description: Repeated /api/v1/status polling
    max_growth_kib: baseline_required
    max_growth_percent: 5.0
    notes: Growth should flatten after initial warmup

  icmp_probe_loop:
    description: Continuous ICMP probe execution
    max_growth_kib: baseline_required
    max_growth_percent: 10.0
    notes: Some growth acceptable during probe target discovery

  diagnostic_capture_loop:
    description: Continuous diagnostic capture with network_diag
    max_growth_kib: baseline_required
    max_growth_percent: 10.0
    notes: Growth should flatten after warmup

# Budget enforcement
enforcement:
  gate_level: fast_local
  fail_on_budget_exceeded: true
  baseline_required_tolerance_percent: 0
