# UVB-76 Memory Budget — Go Control Tower
#
# Memory budgets are explicit product contracts for UVB-76.
# Values marked "baseline_required" must be measured before being set.
#
# Reference: kgb://doctrine/embedded-memory-frugality

version: "1.0"
service: uvb76
description: |
  Memory budgets for the UVB-76 Go control tower daemon.
  These budgets establish RSS/PSS limits for various operational states.

# GitHub-hosted CI idle baselines (first green run 28013478727)
# These are WARNING-ONLY thresholds from first measurement; router/embedded baselines remain required
ci_idle_baselines:
  github_hosted_ubuntu:
    # First green run: workflow 28013478727, artifact 7815736986
    # Values are guidance only; router/embedded remain baseline_required
    idle:
      rss_kib: 11784
      pss_kib: 11776
      growth_rss_kib: 0
      growth_percent: 0.0
      warning_threshold_rss_kib: 18000
      notes: |
        First GitHub-hosted idle baseline. Warning-only (fail_on_budget_exceeded: false).
        Source: workflow run 28013478727, artifact uvb76-memory-lab (ID 7815736986).
        Router/embedded hardware baselines remain baseline_required.
    evidence_sources:
      - workflow_run: 28013478727
        artifact_id: 7815736986
        artifact_name: uvb76-memory-lab
        service_version: "1.0.0"
        service_commit: "642befe"
        workload: uvb76-idle-warmup
        duration_seconds: 120
        environment_label: github_hosted_ubuntu

# GitHub-hosted CI leak-slope baselines (first evidence run 28018628934)
# These are SHORT-WINDOW baselines labeled as warmup_sensitive.
# NOT definitive leak proof - use medium/long manual mode for actual leak signal quality.
ci_leak_slope_baselines:
  github_hosted_ubuntu:
    # First short-window leak-slope evidence: workflow 28018628934, artifact 7817907256
    # Labeled as short_window / warmup_sensitive - NOT definitive leak proof
    evidence_status: short_window_evidence
    signal_quality: warmup_sensitive
    short_window_seconds: 10
    uvb76_leak_slope:
      rss_slope_kib_per_min: 770.9
      pss_slope_kib_per_min: 771.5
      rss_max_kib: 11820
      pss_max_kib: 11812
      rss_growth_kib: 128
      pss_growth_kib: 128
      operations: 100
      errors: 0
      duration_ms: 9959
      notes: |
        Short-window baseline (10s). warmup_sensitive - NOT definitive leak proof.
        Stable growth in short window, low slope.
        Use medium/long manual mode for actual leak signal quality.
        Source: workflow run 28018628934, artifact uvb76-memory-lab (ID 7817907256).
    uvb76_leak_slope_netdiag:
      rss_slope_kib_per_min: 794.8
      pss_slope_kib_per_min: 795.4
      rss_max_kib: 11824
      pss_max_kib: 11816
      rss_growth_kib: 132
      pss_growth_kib: 132
      operations: 100
      errors: 0
      duration_ms: 9959
      notes: |
        Short-window baseline with network_diag (10s). warmup_sensitive - NOT definitive leak proof.
        Stable growth similar to non-netdiag variant.
        Use medium/long manual mode for actual leak signal quality.
        Source: workflow run 28018628934, artifact uvb76-memory-lab (ID 7817907256).
    evidence_sources:
      - workflow_run: 28018628934
        artifact_id: 7817907256
        artifact_name: uvb76-memory-lab
        service_version: "1.0.0"
        service_commit: "642befe"
        workload: uvb76-leak-slope
        duration_seconds: 9.959
        environment_label: github_hosted_ubuntu
        workload_type: uvb76_leak_slope
        short_window_seconds: 10
        signal_quality: warmup_sensitive
      - workflow_run: 28018628934
        artifact_id: 7817907256
        artifact_name: uvb76-memory-lab
        service_version: "1.0.0"
        service_commit: "642befe"
        workload: uvb76-leak-slope-netdiag
        duration_seconds: 9.959
        environment_label: github_hosted_ubuntu
        workload_type: uvb76_leak_slope_netdiag
        short_window_seconds: 10
        signal_quality: warmup_sensitive

# GitHub-hosted CI long-window leak-slope baselines (first evidence run 28024460972)
# These are LONG-WINDOW baselines with signal_quality: long_window.
# Stronger signal than short-window - warmup has settled.
ci_leak_slope_long_window:
  github_hosted_ubuntu:
    # First long-window leak-slope evidence: workflow 28024460972, artifact 7820989961
    # This is the FIRST durable long-window evidence - strong leak-slope signal.
    evidence_status: long_window_evidence
    signal_quality: long_window
    long_window_seconds: 900
    uvb76_leak_slope:
      rss_slope_kib_per_min: 360.72
      pss_slope_kib_per_min: 360.72
      rss_max_kib: 17344
      pss_max_kib: 17336
      rss_growth_kib: 5448
      pss_growth_kib: 5448
      operations: 9000
      errors: 0
      duration_ms: 906198
      duration_seconds: 906.198
      warmup_seconds: 180
      notes: |
        Long-window baseline (906s). signal_quality: long_window - durable leak-slope evidence.
        Warmup has settled; this is stronger evidence than short-window baselines.
        Source: workflow run 28024460972, artifact uvb76-memory-lab (ID 7820989961).
        Evidence preserved in: docs/evidence/memory-lab/run-28024460972/
    evidence_sources:
      - workflow_run: 28024460972
        artifact_id: 7820989961
        artifact_name: uvb76-memory-lab
        service_version: "unknown"
        service_commit: "189937815e2493d4179e6bc9729cde74785699ef"
        workload: uvb76-leak-slope
        duration_seconds: 906.198
        operations: 9000
        request_errors: 0
        environment_label: github_hosted_ubuntu
        workload_type: uvb76_leak_slope
        long_window_seconds: 900
        signal_quality: long_window

# Proposed warning thresholds (for medium/long manual mode)
# Router/embedded leak-slope baselines remain baseline_required
ci_leak_slope_thresholds:
  github_hosted_ubuntu:
    evidence_status: proposed_thresholds
    uvb76_leak_slope:
      rss_slope_warning_kib_per_min: 200.0
      pss_slope_warning_kib_per_min: 180.0
      max_growth_kib: 1000
      notes: |
        Proposed warning-only threshold for medium/long manual mode.
        Router/embedded leak-slope baselines remain baseline_required.
    uvb76_leak_slope_netdiag:
      rss_slope_warning_kib_per_min: 300.0
      pss_slope_warning_kib_per_min: 250.0
      max_growth_kib: 1500
      notes: |
        Proposed warning-only threshold for medium/long manual mode.
        Router/embedded leak-slope baselines remain baseline_required.

# Manual mode presets for medium/long leak-slope soaks
# These are guidance only - actual thresholds should come from real evidence
manual_leak_slope_profiles:
  short:
    # Default: 10-second window (as used in CI)
    warmup_seconds: 60
    operations: 100
    interval_ms: 100
    duration_seconds: 10
    notes: "Short window - warmup-sensitive, not definitive leak proof"
  medium:
    # 5-minute soak for better leak signal quality
    warmup_seconds: 120
    operations: 3000
    interval_ms: 100
    duration_seconds: 300
    notes: "Medium window - better signal, still warmup-influenced"
  long:
    # 15-minute soak for actual leak detection
    warmup_seconds: 180
    operations: 9000
    interval_ms: 100
    duration_seconds: 900
    notes: "Long window - warmup settles, actual leak signal visible"
  manual_soak:
    # User-configurable soak (specify operations/interval directly)
    warmup_seconds: 300
    operations: 36000
    interval_ms: 100
    duration_seconds: 3600
    notes: "60-minute manual soak - use for definitive leak analysis"

# Architecture-specific budgets
arch_budgets:
  linux/arm64:
    # Idle state — after initial startup, no active probing
    idle:
      rss_kib: baseline_required
      pss_kib: baseline_required
      heap_alloc_bytes: baseline_required
      goroutines_max: baseline_required
      notes: Run make lab-uvb76-memory to generate real baseline

    # Warm steady-state — with active probing and collection
    warm:
      rss_kib: baseline_required
      pss_kib: baseline_required
      heap_alloc_bytes: baseline_required
      goroutines_max: baseline_required
      growth_allowed_kib: baseline_required
      notes: Run make lab-uvb76-memory to generate real baseline

    # Hot-path allocation budgets (per-call)
    hot_paths:
      status_api:
        alloc_bytes_max: baseline_required
        notes: Maximum allocation during /api/v1/status render
      diagnostic_capture:
        alloc_bytes_max: baseline_required
        notes: Maximum allocation during diagnostic packet capture
      icmp_probe:
        alloc_bytes_max: baseline_required
        notes: Maximum allocation per ICMP probe cycle
      tcp_quality_collector:
        alloc_bytes_max: baseline_required
        notes: Maximum allocation per TCP quality sample
      route_collector:
        alloc_bytes_max: baseline_required
        notes: Maximum allocation per route collection cycle
      spike_diagnostics:
        alloc_bytes_max: baseline_required
        notes: Maximum allocation per spike diagnostic render

    # History and artifact caps
    history:
      max_retained_targets: 1000
      max_retained_results: 10000
      max_diagnostic_buffer_kib: 512
      max_log_buffer_mb: 10
      notes: Explicit retention limits to prevent unbounded growth

    # Max response/artifact sizes
    max_response:
      status_json_kib: 256
      diagnostic_packet_kib: 128
      notes: Bounded response sizes; must not grow unbounded

  linux/amd64:
    idle:
      rss_kib: baseline_required
      pss_kib: baseline_required
    warm:
      rss_kib: baseline_required
      pss_kib: baseline_required
      growth_allowed_kib: baseline_required

  darwin/arm64:
    # macOS development builds may have higher baseline
    idle:
      rss_kib: baseline_required
      pss_kib: baseline_required
    warm:
      rss_kib: baseline_required
      pss_kib: baseline_required
      growth_allowed_kib: baseline_required

# Workload-specific budgets for memory labs
workload_budgets:
  status_api_polling:
    description: Repeated /api/v1/status polling
    max_growth_kib: baseline_required
    max_growth_percent: 5.0
    notes: Growth should flatten after initial warmup

  icmp_probe_loop:
    description: Continuous ICMP probe execution
    max_growth_kib: baseline_required
    max_growth_percent: 10.0
    notes: Some growth acceptable during probe target discovery

  diagnostic_capture_loop:
    description: Continuous diagnostic capture with network_diag
    max_growth_kib: baseline_required
    max_growth_percent: 10.0
    notes: Growth should flatten after warmup

# Budget enforcement
enforcement:
  gate_level: fast_local
  fail_on_budget_exceeded: true
  baseline_required_tolerance_percent: 0
