# Tovarisch Memory Budget — Zig Leaf Daemon
#
# Memory budgets are explicit product contracts for tovarisch.
# Values marked "baseline_required" must be measured before being set.
#
# Reference: kgb://doctrine/embedded-memory-frugality

version: "1.0"
service: tovarisch
description: |
  Memory budgets for the tovarisch Zig leaf daemon.
  These budgets establish RSS/PSS limits for various operational states.

# GitHub-hosted CI idle baselines (first green run 28013478727)
# These are WARNING-ONLY thresholds from first measurement; router/embedded baselines remain required
ci_idle_baselines:
  github_hosted_ubuntu:
    # First green run: workflow 28013478727, artifact 7815736588
    # Values are guidance only; router/embedded remain baseline_required
    idle:
      rss_kib: 8148
      pss_kib: 6264
      growth_rss_kib: 52
      growth_percent: 0.64
      warning_threshold_rss_kib: 12000
      notes: |
        First GitHub-hosted idle baseline. Warning-only (fail_on_budget_exceeded: false).
        Source: workflow run 28013478727, artifact tovarisch-memory-lab (ID 7815736588).
        Router/embedded hardware baselines remain baseline_required.
    evidence_sources:
      - workflow_run: 28013478727
        artifact_id: 7815736588
        artifact_name: tovarisch-memory-lab
        service_version: "0.1.0"
        service_commit: "642befe"
        workload: tovarisch-idle-warmup
        duration_seconds: 60
        environment_label: github_hosted_ubuntu

# GitHub-hosted CI leak-slope baselines (first evidence run 28018628934)
# These are SHORT-WINDOW baselines labeled as warmup_sensitive.
# NOT definitive leak proof - use medium/long manual mode for actual leak signal quality.
ci_leak_slope_baselines:
  github_hosted_ubuntu:
    # First short-window leak-slope evidence: workflow 28018628934, artifact 7817906532
    # Labeled as short_window / warmup_sensitive - NOT definitive leak proof
    evidence_status: short_window_evidence
    signal_quality: warmup_sensitive
    short_window_seconds: 10
    tovarisch_leak_slope:
      rss_slope_kib_per_min: 5503.0
      pss_slope_kib_per_min: 5503.0
      rss_max_kib: 9160
      pss_max_kib: 7128
      rss_growth_kib: 916
      pss_growth_kib: 916
      operations: 100
      errors: 0
      duration_ms: 9984
      notes: |
        Short-window baseline (10s). warmup_sensitive - NOT definitive leak proof.
        High slope due to warmup effect in short window.
        Use medium/long manual mode for actual leak signal quality.
        Source: workflow run 28018628934, artifact tovarisch-memory-lab (ID 7817906532).
    tovarisch_leak_slope_netdiag:
      rss_slope_kib_per_min: 696.9
      pss_slope_kib_per_min: 696.9
      rss_max_kib: 9080
      pss_max_kib: 7081
      rss_growth_kib: 116
      pss_growth_kib: 116
      operations: 100
      errors: 0
      duration_ms: 9985
      notes: |
        Short-window baseline with network_diag (10s). warmup_sensitive - NOT definitive leak proof.
        Stable slope after warmup, lower than non-netdiag variant.
        Use medium/long manual mode for actual leak signal quality.
        Source: workflow run 28018628934, artifact tovarisch-memory-lab (ID 7817906532).
    evidence_sources:
      - workflow_run: 28018628934
        artifact_id: 7817906532
        artifact_name: tovarisch-memory-lab
        service_version: "0.1.0"
        service_commit: "642befe"
        workload: tovarisch-leak-slope
        duration_seconds: 9.984
        environment_label: github_hosted_ubuntu
        workload_type: tovarisch_leak_slope
        short_window_seconds: 10
        signal_quality: warmup_sensitive
      - workflow_run: 28018628934
        artifact_id: 7817906532
        artifact_name: tovarisch-memory-lab
        service_version: "0.1.0"
        service_commit: "642befe"
        workload: tovarisch-leak-slope-netdiag
        duration_seconds: 9.985
        environment_label: github_hosted_ubuntu
        workload_type: tovarisch_leak_slope_netdiag
        short_window_seconds: 10
        signal_quality: warmup_sensitive

# GitHub-hosted CI long-window leak-slope baselines (first evidence run 28024460972)
# These are LONG-WINDOW baselines with signal_quality: long_window.
# Stronger signal than short-window - warmup has settled.
ci_leak_slope_long_window:
  github_hosted_ubuntu:
    # First long-window leak-slope evidence: workflow 28024460972, artifact 7820989700
    # This is the FIRST durable long-window evidence - strong leak-slope signal.
    evidence_status: long_window_evidence
    signal_quality: long_window
    long_window_seconds: 900
    tovarisch_leak_slope:
      rss_slope_kib_per_min: 60.47
      pss_slope_kib_per_min: 60.47
      rss_max_kib: 9004
      pss_max_kib: 7122
      rss_growth_kib: 916
      pss_growth_kib: 916
      operations: 9000
      errors: 0
      duration_ms: 908819
      duration_seconds: 908.819
      warmup_seconds: 180
      notes: |
        Long-window baseline (908s). signal_quality: long_window - durable leak-slope evidence.
        Warmup has settled; this is stronger evidence than short-window baselines.
        Stable low slope after warmup.
        Source: workflow run 28024460972, artifact tovarisch-memory-lab (ID 7820989700).
        Evidence preserved in: docs/evidence/memory-lab/run-28024460972/
    evidence_sources:
      - workflow_run: 28024460972
        artifact_id: 7820989700
        artifact_name: tovarisch-memory-lab
        service_version: "tovarisch 0.1.2+1899378"
        service_commit: "189937815e2493d4179e6bc9729cde74785699ef"
        workload: tovarisch-leak-slope
        duration_seconds: 908.819
        operations: 9000
        request_errors: 0
        environment_label: github_hosted_ubuntu
        workload_type: tovarisch_leak_slope
        long_window_seconds: 900
        signal_quality: long_window

# Proposed warning thresholds (for medium/long manual mode)
# Router/embedded leak-slope baselines remain baseline_required
ci_leak_slope_thresholds:
  github_hosted_ubuntu:
    evidence_status: proposed_thresholds
    tovarisch_leak_slope:
      rss_slope_warning_kib_per_min: 100.0
      pss_slope_warning_kib_per_min: 80.0
      max_growth_kib: 500
      notes: |
        Proposed warning-only threshold for medium/long manual mode.
        Router/embedded leak-slope baselines remain baseline_required.
    tovarisch_leak_slope_netdiag:
      rss_slope_warning_kib_per_min: 150.0
      pss_slope_warning_kib_per_min: 120.0
      max_growth_kib: 750
      notes: |
        Proposed warning-only threshold for medium/long manual mode.
        Router/embedded leak-slope baselines remain baseline_required.

# Manual mode presets for medium/long leak-slope soaks
# These are guidance only - actual thresholds should come from real evidence
manual_leak_slope_profiles:
  short:
    # Default: 10-second window (as used in CI)
    warmup_seconds: 60
    operations: 100
    interval_ms: 100
    duration_seconds: 10
    notes: "Short window - warmup-sensitive, not definitive leak proof"
  medium:
    # 5-minute soak for better leak signal quality
    warmup_seconds: 120
    operations: 3000
    interval_ms: 100
    duration_seconds: 300
    notes: "Medium window - better signal, still warmup-influenced"
  long:
    # 15-minute soak for actual leak detection
    warmup_seconds: 180
    operations: 9000
    interval_ms: 100
    duration_seconds: 900
    notes: "Long window - warmup settles, actual leak signal visible"
  manual_soak:
    # User-configurable soak (specify operations/interval directly)
    warmup_seconds: 300
    operations: 36000
    interval_ms: 100
    duration_seconds: 3600
    notes: "60-minute manual soak - use for definitive leak analysis"

# Architecture-specific budgets
arch_budgets:
  linux/arm64:
    # Idle state — after initial startup, no active sessions
    idle:
      rss_kib: baseline_required
      pss_kib: baseline_required
      heap_alloc_bytes: baseline_required
      notes: Run make lab-tovarisch-memory to generate real baseline

    # Warm steady-state — with active BGP/BFD sessions
    warm:
      rss_kib: baseline_required
      pss_kib: baseline_required
      heap_alloc_bytes: baseline_required
      growth_allowed_kib: baseline_required
      notes: Run make lab-tovarisch-memory to generate real baseline

    # Hot-path allocation budgets (per-call)
    hot_paths:
      status_render:
        alloc_bytes_max: baseline_required
        notes: Maximum allocation during /status or /status.json render
      status_json_render:
        alloc_bytes_max: baseline_required
        notes: Maximum allocation during /status.json?include=network_diag render
      bgp_status_render:
        alloc_bytes_max: baseline_required
        notes: Maximum allocation during BGP status section render
      bfd_status_render:
        alloc_bytes_max: baseline_required
        notes: Maximum allocation during BFD status section render
      config_parse:
        alloc_bytes_max: baseline_required
        notes: Maximum allocation during config file parsing

    # History and artifact caps
    history:
      max_retained_routes: 10000
      max_retained_sessions: 100
      max_diagnostic_buffer_kib: 256
      notes: Explicit retention limits to prevent unbounded growth

    # Max response sizes
    max_response:
      status_json_kib: 64
      status_plaintext_kib: 16
      notes: Bounded response sizes; must not grow unbounded

  linux/amd64:
    # Baseline same as arm64 unless measured otherwise
    idle:
      rss_kib: baseline_required
      pss_kib: baseline_required
    warm:
      rss_kib: baseline_required
      pss_kib: baseline_required
      growth_allowed_kib: baseline_required

  darwin/arm64:
    # macOS development builds may have higher baseline
    idle:
      rss_kib: baseline_required
      pss_kib: baseline_required
    warm:
      rss_kib: baseline_required
      pss_kib: baseline_required
      growth_allowed_kib: baseline_required

# Workload-specific budgets for memory labs
workload_budgets:
  status_json_warmup:
    description: Repeated /status.json calls after warmup
    max_growth_kib: baseline_required
    max_growth_percent: 5.0
    notes: Growth should flatten after initial warmup

  bgp_bfd_steady_state:
    description: Continuous BGP/BFD status with real peers
    max_growth_kib: baseline_required
    max_growth_percent: 10.0
    notes: Some growth acceptable during session establishment

# Budget enforcement
enforcement:
  gate_level: fast_local
  fail_on_budget_exceeded: true
  baseline_required_tolerance_percent: 0
